</style></head><body><div id="app"><header class="mast"><div class="seal">Ω</div><div class="title"><span>A Fakemon field experiment</span><b>Wild Encounters</b></div><button id="guideBtn">Field guide</button><button id="menuBtn">Save</button></header><main class="shell"><section class="mission"><div><b id="areaName">Toygrass Terrace</b></div><span id="objective"></span><div class="progress"><span id="friendCount">0 of 3 friends</span><span class="bar"><i id="friendBar"></i></span></div></section><div class="play"><section class="stage"><canvas id="world" width="768" height="480" tabindex="0" aria-label="Wild Encounters field. Use WASD or arrow keys to walk."></canvas><div id="behavior" class="behavior" role="status" aria-live="polite"></div><div class="caption" id="status" role="status" aria-live="polite"></div></section><aside class="side"><h2>Field actions</h2><div class="actions" id="actions"><button data-action="observe">Observe<br><small>O</small></button><button data-action="environment" class="primary">Change surroundings<br><small>C</small></button><button data-action="space">Give space<br><small>Q</small></button><button data-action="approach">Wait for approach<br><small>Space</small></button></div><div class="habitats" id="habitats"></div></aside></div><section class="touch" id="touch" aria-label="Touch controls"><div class="dpad"><button data-action="move" data-dir="north" aria-label="Move north">▲</button><button data-action="move" data-dir="west" aria-label="Move west">◀</button><button data-action="move" data-dir="south" aria-label="Move south">▼</button><button data-action="move" data-dir="east" aria-label="Move east">▶</button></div><div class="small-actions"><button data-action="observe">Observe</button><button data-action="environment" class="primary">Change</button><button data-action="space">Space</button><button data-action="approach">Wait</button><button data-action="guide">Guide</button><button data-action="menu">Save</button></div></section><section class="camp"><div class="camp-head"><span id="campLabel">Camp</span><span>Friends choose to visit</span></div><div class="camp-row" id="camp"></div></section></main></div><div class="overlay" id="overlay" hidden><section class="panel" id="modal" role="dialog" aria-modal="true" aria-label="Wild Encounters guide"></section></div><input id="importInput" type="file" accept="application/json,.json" hidden><script>const ECHO_ASSETS = {"pug": "../../assets/b0991b363e363dae322ffef642a504057604bc58c07b64a37b0c0ff8619506f9.png", "octopus": "../../assets/87c4a51b9af12bf79395e81c0f2cd11c0534b6aa9b553d9e514d460a6f3669c6.png", "minotaur": "../../assets/2e225617fb11469b161ff1d34936b0de223ecd56274ea4c6cd9f5794e06142ab.png", "siren": "../../assets/62e5d178c154a36e799cce167d6c10a663a0434eec0adb1edbdcbef6a5a1d0dd.png", "nautilus": "../../assets/b51f5f95e1eaf5745ff8b42c0286ffa87a8b40a1574849959c68f9614520873c.png", "professor": "../../assets/eb209755957154d301d41ed7dc6a389f01f4b5729103f9810468aa672a13a147.png", "rockman": "../../assets/276d100b62c5c2fe0a3933b975ccb5e31202fa7b67b8d671c694497f7095b099.png"};</script><script>/* Wild Encounters: pure encounter rules plus a small, dependency-free browser shell. */
const WildEncounters = (() => {
  'use strict';
  const VERSION = 2;
  const RELEASE = 'wild-encounters-demo';
  const AREAS = Object.freeze({
    pug: {id:'pug', name:'Toygrass Terrace', creature:'pug', goal:'Watch how Pug reacts near the marble path.'},
    octopus: {id:'octopus', name:'Blue Channel', creature:'octopus', goal:'The channel is blocked near the quiet bank.'},
    nautilus: {id:'nautilus', name:'Shell Cove', creature:'nautilus', goal:'An exposed shell shelter needs care.'}
  });
  const ORDER = ['pug','octopus','nautilus'];
  const DIRECTION = Object.freeze({north:{x:0,y:-1},east:{x:1,y:0},south:{x:0,y:1},west:{x:-1,y:0}});
  const SPAWNS = Object.freeze({pug:{x:3,y:7},octopus:{x:3,y:7},nautilus:{x:3,y:7}});
  const CREATURES = Object.freeze({
    pug:{x:12,y:6, ring:3, conditions:['toyPlaced','spaceGiven'], environment:'toyPlaced', distance:'spaceGiven', target:{x:8,y:6,label:'soft thyme patch'}},
    octopus:{x:13,y:6, ring:3, conditions:['channelCleared','quietBank'], environment:'channelCleared', distance:'quietBank', target:{x:9,y:6,label:'blocked channel'}},
    nautilus:{x:13,y:6, ring:3, conditions:['shelterRestored','spaceGiven'], environment:'shelterRestored', distance:'spaceGiven', target:{x:9,y:6,label:'loose shelter shells'}}
  });
  const clone = value => JSON.parse(JSON.stringify(value));
  const validArea = value => Object.prototype.hasOwnProperty.call(AREAS, value);
  const validDirection = value => Object.prototype.hasOwnProperty.call(DIRECTION, value);
  const message = (kind, text, extra) => Object.assign({kind, text}, extra || {});
  const count = value => Object.values(value).filter(Boolean).length;

  function habitat() { return {observed:false, toyPlaced:false, spaceGiven:false, channelCleared:false, quietBank:false, shelterRestored:false, comfort:0, setbacks:0}; }
  function fresh() {
    return {version:VERSION, release:RELEASE, area:'pug', player:{x:3,y:7,facing:'east'}, time:0,
      tutorial:'intro', friendships:{pug:false,octopus:false,nautilus:false}, habitats:{pug:habitat(),octopus:habitat(),nautilus:habitat()}};
  }
  function normalize(raw) {
    if (!raw || typeof raw !== 'object' || raw.version !== VERSION || raw.release !== RELEASE) return null;
    const state = fresh();
    state.area = validArea(raw.area) ? raw.area : state.area;
    const player = raw.player || {};
    state.player = {x:Number.isInteger(player.x) && player.x >= 1 && player.x <= 15 ? player.x : SPAWNS[state.area].x,
      y:Number.isInteger(player.y) && player.y >= 1 && player.y <= 9 ? player.y : SPAWNS[state.area].y,
      facing:validDirection(player.facing) ? player.facing : 'east'};
    state.time = Number.isInteger(raw.time) && raw.time >= 0 && raw.time <= 9999 ? raw.time : 0;
    state.tutorial = ['intro','demo','practice','complete'].includes(raw.tutorial) ? raw.tutorial : 'intro';
    for (const id of ORDER) {
      const saved = raw.habitats && raw.habitats[id] || {};
      const target = CREATURES[id];
      state.friendships[id] = raw.friendships && raw.friendships[id] === true;
      state.habitats[id].observed = saved.observed === true;
      for (const key of target.conditions) state.habitats[id][key] = saved[key] === true;
      state.habitats[id].comfort = Number.isInteger(saved.comfort) && saved.comfort >= 0 && saved.comfort <= 2 ? saved.comfort : 0;
      state.habitats[id].setbacks = Number.isInteger(saved.setbacks) && saved.setbacks >= 0 && saved.setbacks <= 99 ? saved.setbacks : 0;
      if (state.friendships[id]) { for (const key of target.conditions) state.habitats[id][key] = true; state.habitats[id].comfort = 2; }
    }
    if (state.friendships.pug && state.tutorial !== 'complete') state.tutorial = 'complete';
    return state;
  }
  function active(state) { return state.habitats[state.area]; }
  function creature(state) { return CREATURES[state.area]; }
  function conditionsMet(state) { const h = active(state), c = creature(state); return c.conditions.every(key => h[key]); }
  function distanceToCreature(state) { const c = creature(state), p = state.player; return Math.abs(p.x-c.x)+Math.abs(p.y-c.y); }
  function insideComfortRing(state) { return distanceToCreature(state) <= creature(state).ring; }
  function nearCreature(state) { return distanceToCreature(state) <= 7; }
  function nearEnvironment(state) { const t = creature(state).target, p = state.player; return Math.abs(p.x-t.x)+Math.abs(p.y-t.y) <= 1; }
  function inWatchingBand(state) { const distance = distanceToCreature(state); return distance > creature(state).ring && distance <= 7; }
  function isWalkable(source, x, y) {
    const state=normalize(source); if (!state || x < 1 || x > 15 || y < 1 || y > 9) return false;
    return !((state.area === 'octopus' || state.area === 'nautilus') && x >= 11 && y >= 2 && y <= 8);
  }
  function nextState(state, change) { const result = normalize(state) || fresh(); change(result); return normalize(result) || fresh(); }
  function behavior(state, id) {
    if (state.friendships[id]) return id === 'pug' ? 'visiting camp' : id === 'octopus' ? 'curling a friendly tentacle at camp' : 'resting safely at camp';
    const h = state.habitats[id];
    if (h.setbacks && h.comfort === 0) return id === 'pug' ? 'Pug ducks behind thyme after the sudden step' : id === 'octopus' ? 'Octopus tucks behind a stone after the noisy moment' : 'Nautilus slips behind its shell after the close step';
    if (id === 'pug') return h.toyPlaced && h.spaceGiven ? 'trotting toward the toy from a calm distance' : h.toyPlaced ? 'sniffing the toy and checking your distance' : 'pawing an empty thyme patch';
    if (id === 'octopus') return h.channelCleared && h.quietBank ? 'gliding through the open channel from the quiet bank' : h.channelCleared ? 'testing the newly clear channel' : 'bumping the reed-blocked channel, then slipping back';
    return h.shelterRestored && h.spaceGiven ? 'emerging beside the restored shelter' : h.shelterRestored ? 'settling by its sheltered shell' : 'retreating from open water beside loose shelter shells';
  }
  function step(source, command) {
    const state = normalize(source) || fresh();
    const action = command && command.type;
    const response = {state, events:[]};
    if (!action) { response.events.push(message('info','Choose an action when you are ready.')); return response; }
    let event;
    const moved = action === 'move' || ['observe','environment','space','approach'].includes(action);
    response.state = nextState(state, next => {
      if (moved) next.time += 1;
      const resetComfort = h => { h.comfort=0; h.spaceGiven=false; h[creature(next).distance]=false; h.setbacks+=1; };
      const setback = text => { const h = active(next); resetComfort(h); event=message('wrong',`${text} Comfort resets, but helpful habitat changes stay.`); };
      if (action === 'move') {
        const direction = command.direction;
        if (!validDirection(direction)) { event = message('wrong','That direction is not available.'); return; }
        next.player.facing = direction;
        const d = DIRECTION[direction], x = next.player.x + d.x, y = next.player.y + d.y;
        if (!isWalkable(next,x,y)) event = message('wrong',(x < 1 || x > 15 || y < 1 || y > 9) ? 'A low marble wall marks the edge of this habitat.' : 'The water begins beyond this sandy bank.');
        else { next.player.x=x; next.player.y=y; if (insideComfortRing(next)) { const h=active(next); resetComfort(h); event=message('wrong',`${next.area==='pug'?'Pug backs behind the thyme.':next.area==='octopus'?'Octopus folds into a crevice.':'Nautilus slips behind its shell.'} You are inside the red comfort ring.`); } else event=message('move','You take a quiet step.'); }
        return;
      }
      if (action === 'travel') {
        if (!validArea(command.area)) { event=message('wrong','That habitat is not on the field map.'); return; }
        next.area=command.area; next.player=Object.assign({facing:'east'},SPAWNS[command.area]); event=message('move',`You arrive at ${AREAS[command.area].name}.`); return;
      }
      if (action === 'tutorial') {
        if (command.stage === 'demo') { next.tutorial='demo'; event=message('tutorial','Professor Thales places a soft toy. Pug sniffs it, then pauses when he steps back.'); }
        else if (command.stage === 'practice') { next.tutorial='practice'; next.area='pug'; next.player={x:7,y:6,facing:'east'}; event=message('tutorial','Your turn: use Observe from the turquoise watching band. There is no hurry.'); }
        else if (command.stage === 'complete') { next.tutorial='complete'; event=message('tutorial','The guide stays available from the Field guide button.'); }
        else event=message('wrong','Choose the next guide card.');
        return;
      }
      const h = active(next), id = next.area, c = creature(next);
      if (action === 'observe') {
        if (!nearCreature(next)) { event=message('info','You cannot read the signal from here. Walk into the turquoise watching band, then observe.'); return; }
        h.observed = true;
        if (next.tutorial === 'practice' && id === 'pug') next.tutorial='complete';
        event = message('right', id === 'pug' ? 'Pug checks the path, then looks at anything soft left nearby.' : id === 'octopus' ? 'The Octopus keeps one eye on the narrow channel and another on the bank.' : 'Nautilus stays close to a place where its shell can rest safely.');
        return;
      }
      if (action === 'environment') {
        if (!nearEnvironment(next)) { setback(`The useful place is nearby, but not here. Look for the marked ${c.target.label}.`); return; }
        h[c.environment] = true;
        event = message('right', id === 'pug' ? 'You set down the soft toy without tossing it. Pug notices.' : id === 'octopus' ? 'You clear reeds from the channel. Water can pass again.' : 'You fit the loose shell pieces into a shaded shelter.');
        return;
      }
      if (action === 'space') {
        if (!inWatchingBand(next)) { setback(insideComfortRing(next) ? 'The creature needs more room before it can settle.' : 'Step close enough to watch, but stay outside the red comfort ring.'); return; }
        h.spaceGiven = true; h[c.distance] = true; h.comfort=2;
        event = message('right', id === 'octopus' ? 'You wait on the quiet bank. The water settles.' : 'You make room and wait without following.');
        return;
      }
      if (action === 'approach') {
        if (!inWatchingBand(next)) { setback(insideComfortRing(next) ? 'You stepped inside the comfort ring instead of waiting for an approach.' : 'Move to the turquoise watching band before waiting.'); return; }
        if (conditionsMet(next)) { next.friendships[id]=true; h.comfort=2; const allFriends=count(next.friendships)===ORDER.length; event=message('friend',`${id === 'pug' ? 'Pug trots' : id === 'octopus' ? 'Octopus glides' : 'Nautilus emerges'} over by choice. ${allFriends?'All three friends chose camp — field study complete!':'A new friend joins the camp!'}`,{friend:id,complete:allFriends}); }
        else setback('They are not ready yet. Watch their signal, help the marked place, then give space.');
        return;
      }
      event=message('wrong','That field action is not available.');
    });
    response.events.push(event || message('info','The habitat stays calm.'));
    return response;
  }
  function view(source) {
    const state = normalize(source) || fresh(), h = active(state), c = creature(state);

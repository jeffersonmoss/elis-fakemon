n\">Field guide<\/button><button id=\"menuBtn\">Save &amp; more<\/button><\/header>\n  <main class=\"shell\">\n    <div class=\"mission\"><div class=\"room\" id=\"roomName\">Aegean Landing<\/div><div class=\"goal\" id=\"objective\">Meet the professor and explore the ruins.<\/div><div class=\"mission-actions\"><button id=\"hintBtn\">Hint<\/button><button id=\"undoBtn\">Undo<\/button><button id=\"resetBtn\">Reset room<\/button><\/div><\/div>\n    <div class=\"play\">\n      <section class=\"stage\" id=\"stage\"><canvas id=\"world\" width=\"1008\" height=\"624\" tabindex=\"0\" aria-label=\"Echo Ruins map. Use arrow keys or WASD to explore.\"><\/canvas><div class=\"map-label\" id=\"mapLabel\">Aegean Landing<\/div><div class=\"context\" id=\"contextHint\">Move with WASD or the arrow buttons.<\/div><\/section>\n      <aside class=\"side\" aria-label=\"Companion field controls\">\n        <h2>Companions \u00b7 choose one<\/h2><div class=\"companions\" id=\"companions\"><\/div>\n        <div class=\"inventory\"><span class=\"chip\" id=\"orbCount\">8 Echo Orbs<\/span><span class=\"chip\" id=\"potionCount\">3 Tonics<\/span><\/div>\n        <div class=\"field-actions\"><button id=\"placeBtn\" class=\"primary\">Place ahead <small>P<\/small><\/button><button id=\"useBtn\" class=\"gold\">Use power <small>Space<\/small><\/button><button id=\"interactBtn\">Interact <small>E<\/small><\/button><button id=\"recallBtn\">Recall <small>Q<\/small><\/button><button id=\"facePromptBtn\">Turn \u25b8<\/button><\/div>\n        <div class=\"facing\" id=\"facing\" aria-label=\"Turn deployed companion\"><button data-face=\"north\" aria-label=\"Face north\">\u25b2<\/button><button data-face=\"west\" aria-label=\"Face west\">\u25c0<\/button><button data-face=\"south\" aria-label=\"Face south\">\u25bc<\/button><button data-face=\"east\" aria-label=\"Face east\">\u25b6<\/button><\/div>\n        <div class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">Professor Thales has a quick demonstration ready.<\/div>\n        <div class=\"keyline\"><kbd>WASD<\/kbd> walk \u00b7 <kbd>1\u20134<\/kbd> choose \u00b7 <kbd>P<\/kbd> place \u00b7 <kbd>Space<\/kbd> power \u00b7 <kbd>E<\/kbd> interact \u00b7 <kbd>Q<\/kbd> recall<\/div>\n      <\/aside>\n    <\/div>\n    <div class=\"mobile\" aria-label=\"Touch controls\"><div class=\"dpad\"><button data-dir=\"north\" aria-label=\"Move north\">\u25b2<\/button><button data-dir=\"west\" aria-label=\"Move west\">\u25c0<\/button><button data-dir=\"south\" aria-label=\"Move south\">\u25bc<\/button><button data-dir=\"east\" aria-label=\"Move east\">\u25b6<\/button><\/div><div class=\"mobile-actions\"><button data-mobile=\"place\">Place<\/button><button data-mobile=\"use\" class=\"gold\">Power<\/button><button data-mobile=\"interact\">Interact<\/button><button data-mobile=\"recall\">Recall<\/button><button data-mobile=\"undo\">Undo<\/button><button data-mobile=\"guide\">Guide<\/button><\/div><\/div>\n  <\/main>\n<\/div>\n<div class=\"overlay\" id=\"overlay\"><section class=\"panel\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\"><\/section><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div><input id=\"importInput\" type=\"file\" accept=\"application/json,.json\" hidden>\n<script>const ECHO_ASSETS = {\"pug\": \"../../assets/b0991b363e363dae322ffef642a504057604bc58c07b64a37b0c0ff8619506f9.png\", \"octopus\": \"../../assets/87c4a51b9af12bf79395e81c0f2cd11c0534b6aa9b553d9e514d460a6f3669c6.png\", \"minotaur\": \"../../assets/2e225617fb11469b161ff1d34936b0de223ecd56274ea4c6cd9f5794e06142ab.png\", \"siren\": \"../../assets/62e5d178c154a36e799cce167d6c10a663a0434eec0adb1edbdcbef6a5a1d0dd.png\", \"nautilus\": \"../../assets/b51f5f95e1eaf5745ff8b42c0286ffa87a8b40a1574849959c68f9614520873c.png\", \"professor\": \"../../assets/eb209755957154d301d41ed7dc6a389f01f4b5729103f9810468aa672a13a147.png\", \"rockman\": \"../../assets/276d100b62c5c2fe0a3933b975ccb5e31202fa7b67b8d671c694497f7095b099.png\"};<\/script>\n<script>\"use strict\";\n\n// Pure combat rules. The browser runtime owns presentation, inventory and saves.\nconst Combat = (() => {\n  let engineSequence = 0;\n  const copy = value => JSON.parse(JSON.stringify(value));\n  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));\n  const finite = (value, fallback) => Number.isFinite(value) ? value : fallback;\n  const dictionary = value => Array.isArray(value)\n    ? Object.fromEntries(value.map(entry => [entry.id, entry]))\n    : value || {};\n\n  function create(content, rng = Math.random, options = {}) {\n    const species = dictionary(content.species);\n    const moves = dictionary(content.moves);\n    const typeChart = content.typeChart || {};\n    const prefix = `${Date.now().toString(36)}-${++engineSequence}`;\n    let serial = 0;\n    const uid = kind => `${kind}-${prefix}-${++serial}`;\n    const roll = () => clamp(finite(rng(), 0.5), 0, 0.999999999999);\n    const event = (type, text, extra = {}) => ({type, text, ...extra});\n\n    function definition(id) {\n      if (!Object.prototype.hasOwnProperty.call(species, id)) {\n        throw new Error(`Unknown creature: ${id}`);\n      }\n      return species[id];\n    }\n\n    for (const [id, sp] of Object.entries(species)) {\n      if (!sp.base || !Number.isFinite(sp.base.hp) || sp.base.hp <= 0) {\n        throw new Error(`Invalid base HP for ${id}`);\n      }\n      if (!Array.isArray(sp.moves) || !sp.moves.length || sp.moves.length > 4 ||\n          sp.moves.some(move => !Object.prototype.hasOwnProperty.call(moves, move))) {\n        throw new Error(`Invalid move set for ${id}`);\n      }\n      if (sp.next) {\n        definition(sp.next);\n        const threshold = sp.evolveAt ?? sp.evolve;\n        if (!Number.isInteger(threshold) || threshold < 2 || threshold > 99) {\n          throw new Error(`Invalid evolution level for ${id}`);\n        }\n      }\n      const seen = new Set([id]);\n      let next = sp.next;\n      while (next) {\n        if (seen.has(next)) throw new Error(`Evolution cycle at ${id}`);\n        seen.add(next);\n        next = definition(next).next;\n      }\n    }\n    for (const [id, move] of Object.entries(moves)) {\n      if (!['attack', 'guard', 'heal'].includes(move.kind || 'attack')) {\n        throw new Error(`Invalid move kind for ${id}`);\n      }\n    }\n\n    function maxHp(mon) {\n      return Math.max(1, Math.floor(definition(mon.species).base.hp + clamp(mon.level, 1, 99) * 3));\n    }\n\n    function makeMon(id, level = 5) {\n      definition(id);\n      const mon = {uid: uid('mon'), species: id,\n        level: Math.floor(clamp(finite(level, 5), 1, 99)), xp: 0, hp: 0};\n      mon.hp = maxHp(mon);\n      return mon;\n    }\n\n    function moveIds(mon) {\n      const defaults = definition(mon.species).moves;\n      const selected = Array.isArray(mon.moves) && mon.moves.length ? mon.moves : defaults;\n      return selected.filter(id => Object.prototype.hasOwnProperty.call(moves, id)).slice(0, 4);\n    }\n\n    function cleanMon(raw) {\n      definition(raw.species);\n      const mon = copy(raw);\n      mon.uid = typeof raw.uid === 'string' && raw.uid ? raw.uid : uid('mon');\n      mon.level = Math.floor(clamp(finite(raw.level, 5), 1, 99));\n      mon.xp = Math.floor(clamp(finite(raw.xp, 0), 0, xpNeeded(mon.level) - 1));\n      mon.hp = Math.floor(clamp(finite(raw.hp, maxHp(mon)), 0, maxHp(mon)));\n      if (raw.moves) {\n        if (!Array.isArray(raw.moves) || !raw.moves.length || raw.moves.length > 4 ||\n            raw.moves.some(id => !Object.prototype.hasOwnProperty.call(moves, id))) {\n          throw new Error(`Invalid learned moves for ${mon.species}`);\n        }\n        mon.moves = [...raw.moves];\n      }\n      return mon;\n    }\n\n    function xpNeeded(level) {\n      return Math.max(7, Math.floor(level) * 7);\n    }\n\n    function applyExperience(raw, amount) {\n      const mon = cleanMon(raw);\n      const evolutions = [];\n      let levelsGained = 0;\n      if (mon.level >= 99) {\n        mon.xp = 0;\n        return {mon, evolutions, levelsGained};\n      }\n      mon.xp += Math.max(0, Math.floor(finite(amount, 0)));\n      while (mon.level < 99 && mon.xp >= xpNeeded(mon.level)) {\n        mon.xp -= xpNeeded(mon.level);\n        const previousMax = maxHp(mon);\n        mon.level++;\n        levelsGained++;\n        let sp = definition(mon.species);\n        while (sp.next && mon.level >= (sp.evolveAt ?? sp.evolve)) {\n          const from = mon.species;\n          mon.species = sp.next;\n          evolutions.push({from, to: mon.species, uid: mon.uid});\n          sp = definition(mon.species);\n        }\n        if (mon.hp > 0) mon.hp = Math.min(maxHp(mon), mon.hp + maxHp(mon) - previousMax);\n      }\n      if (mon.level === 99) mon.xp = 0;\n      return {mon, evolutions, levelsGained};\n    }\n\n    function teach(raw, moveId, slot) {\n      if (!Object.prototype.hasOwnProperty.call(moves, moveId)) throw new Error(`Unknown move: ${moveId}`);\n      const mon = cleanMon(raw);\n      const chosen = moveIds(mon);\n      if (!Number.isInteger(slot) || slot < 0 || slot >= Math.min(4, chosen.length + 1)) {\n        throw new Error('Choose a valid move slot.');\n      }\n      if (slot === 0 && moveId !== definition(mon.species).moves[0]) {\n        throw new Error('Keep the basic move in the first slot.');\n      }\n      if (chosen.includes(moveId) && chosen[slot] !== moveId) throw new Error('That move is already known.');\n      chosen[slot] = moveId;\n      mon.moves = chosen;\n      return mon;\n    }\n\n    function begin(party, encounter) {\n      if (!Array.isArray(party) || !party.length || party.length > 6) {\n        throw new Error('A battle requires a party of one to six creatures.');\n      }\n      const playerParty = party.map(cleanMon);\n      const playerIndex = playerParty.findIndex(mon => mon.hp > 0);\n      if (playerIndex < 0) throw new Error('Your team needs healing before a battle.');\n      const kind = encounter.kind || 'wild';\n      if (!['wild', 'trainer', 'gym'].includes(kind)) throw new Error(`Invalid battle kind: ${kind}`);\n      if (!Array.isArray(encounter.enemyTeam) || !encounter.enemyTeam.length ||\n          encounter.enemyTeam.length > 6 || (kind === 'wild' && encounter.enemyTeam.length !== 1)) {\n        throw new Error('Invalid opposing team.');\n      }\n      const enemyParty = encounter.enemyTeam.map(mon => {\n        const instance = makeMon(mon.species, mon.level);\n        if (mon.moves) instance.moves = [...mon.moves];\n        return cleanMon(instance);\n      });\n      return {\n        id: uid('battle'), playerParty, enemyParty, playerIndex, enemyIndex: 0,\n        phase: 'action', kind, trainerId: encounter.trainerId || null,\n        rewards: copy(encounter.rewards || {}), ballsUsed: 0, potionsUsed: 0,\n        playerGuard: false, enemyGuard: false,\n        participants: [playerParty[playerIndex].uid], turn: 0\n      };\n    }\n\n    function active(battle, side) {\n      return battle[`${side}Party`][battle[`${side}Index`]];\n    }\n    const name = mon => definition(mon.species).name;\n    const stat = (mon, field) => Math.max(1,\n      finite(definition(mon.species).base[field], 8) + mon.level * (field === 'speed' ? 1 : 1.2));\n    function effectiveness(move, defender) {\n      const row = typeChart[move.type] || {};\n      return Math.max(0, finite(row[definition(defender.species).type], 1));\n    }\n\n    function finish(battle, type, events, captured = null) {\n      const evolutions = [];\n      if (type === 'victory') {\n        const experience = battle.enemyParty.reduce((total, mon) => total + 18 + mon.level * 7, 0);\n        battle.playerParty = battle.playerParty.map(mon => {\n          if (mon.hp <= 0) return mon;\n          const amount = Math.floor(experience * (battle.participants.includes(mon.uid) ? 1 : 0.55));\n          const result = applyExperience(mon, amount);\n          evolutions.push(...result.evolutions);\n          events.push(event('experience', `${name(mon)} gained ${amount} experience.`, {\n            uid: mon.uid, amount, levelsGained: result.levelsGained\n          }));\n          if (result.levelsGained) events.push(event('level',\n            `${name(result.mon)} reached level ${result.mon.level}.`, {uid: mon.uid, level: result.mon.level}));\n          return result.mon;\n        });\n      }\n      battle.phase = 'end';\n      battle.playerGuard = false;\n      battle.enemyGuard = false;\n      const outcome = {\n        type, party: copy(battle.playerParty), ballsUsed: battle.ballsUsed,\n        potionsUsed: battle.potionsUsed,\n        rewards: type === 'victory' ? copy(battle.rewards) : {}, evolutions\n      };\n      if (captured) outcome.captured = copy(captured);\n      events.push(event(type, {\n        victory: battle.kind === 'wild' ? 'You won the battle!' : 'You defeated the opposing team!',\n        defeat: 'Your team needs a rest. You will return to a healing center.',\n        capture: `${captured ? name(captured) : 'The creature'} joined your collection!`,\n        run: 'You escaped safely.'\n      }[type]));\n      return outcome;\n    }\n\n    function checkFaint(battle, side, events) {\n      const mon = active(battle, side);\n      if (mon.hp > 0) return null;\n      events.push(event('faint', `${name(mon)} fainted.`, {side, uid: mon.uid}));\n      const party = battle[`${side}Party`];\n      const next = party.findIndex(candidate => candidate.hp > 0);\n      if (next < 0) return finish(battle, side === 'enemy' ? 'victory' : 'defeat', events);\n      battle[`${side}Guard`] = false;\n      if (side === 'player') {\n        battle.phase = 'forced-switch';\n        events.push(event('choose-switch', 'Choose a healthy companion to continue.'));\n      } else {\n        battle.enemyIndex = next;\n        events.push(event('send-out', `Your opponent sends out ${name(active(battle, 'enemy'))}!`, {side, index: next}));\n      }\n      return null;\n    }\n\n    function executeMove(battle, side, moveId, events, customMove = null) {\n      const targetSide = side === 'player' ? 'enemy' : 'player';\n      const mon = active(battle, side);\n      const target = active(battle, targetSide);\n      const move = customMove || moves[moveId];\n      const kind = move.kind || 'attack';\n      if (kind === 'guard') {\n        battle[`${side}Guard`] = true;\n        events.push(event('guard', `${name(mon)} guards against the next hit.`, {side, moveId}));\n        return null;\n      }\n      if (kind === 'heal') {\n        const configured = Number.isFinite(move.healRatio)\n          ? maxHp(mon) * clamp(move.healRatio, 0, 1)\n          : finite(move.heal, move.power > 0 ? move.power : maxHp(mon) * 0.28);\n        const amount = Math.max(1, Math.floor(configured));\n        const restored = Math.min(maxHp(mon) - mon.hp, amount);\n        mon.hp += restored;\n        events.push(event('heal', `${name(mon)} used ${move.name} and recovered ${restored} HP.`, {side, amount: restored, moveId}));\n        return null;\n      }\n      let accuracy = finite(move.accuracy, 1);\n      if (accuracy > 1) accuracy /= 100;\n      accuracy = clamp(accuracy, 0, 1);\n      if (accuracy < 1 && roll() >= accuracy) {\n        events.push(event('miss', `${name(mon)} used ${move.name}, but missed.`, {side, moveId}));\n        return null;\n      }\n      const mult = effectiveness(move, target);\n      // Content powers use a conventional 26\u201365 scale. A basic early hit should\n      // leave room to weaken and capture, rather than decide a fight in one turn.\n      const raw = Math.max(2, finite(move.power, 8) * 0.32 + stat(mon, 'atk') * 0.5 - stat(target, 'def') * 0.28);\n      const guarded = battle[`${targetSide}Guard`];\n      const amount = mult === 0 ? 0 : Math.max(1, Math.floor(raw * mult * (0.9 + roll() * 0.2) * (guarded ? 0.5 : 1)));\n      const dealt = Math.min(target.hp, amount);\n      target.hp -= dealt;\n      if (amount > 0) battle[`${targetSide}Guard`] = false;\n      const effectText = mult === 0 ? ' It had no effect.' : mult > 1 ? ' Very effective!' : mult < 1 ? ' Resisted.' : '';\n      events.push(event('damage', `${name(mon)} used ${move.name}: ${dealt} damage.${effectText}`, {\n        side, targetSide, amount: dealt, multiplier: mult, guarded, moveId\n      }));\n      return checkFaint(battle, targetSide, events);\n    }\n\n    function enemyMove(battle) {\n      const mon = active(battle, 'enemy');\n      const target = active(battle, 'player');\n      const options = moveIds(mon);\n      const healing = options.find(id => moves[id].kind === 'heal');\n      if (healing && mon.hp < maxHp(mon) * 0.35 && roll() < 0.45) return healing;\n      const attacks = options.filter(id => (moves[id].kind || 'attack') === 'attack');\n      if (!attacks.length) return options[0];\n      const ranked = attacks.map(id => {\n        const mv = moves[id];\n        let accuracy = finite(mv.accuracy, 1);\n        if (accuracy > 1) accuracy /= 100;\n        return {id, score: finite(mv.power, 8) * effectiveness(mv, target) * accuracy};\n      }).sort((a, b) => b.score - a.score);\n      if (ranked.length === 1 || roll() < 0.65) return ranked[0].id;\n      return attacks[Math.floor(roll() * attacks.length)];\n    }\n\n    function act(inputBattle, action) {\n      const battle = copy(inputBattle);\n      const events = [];\n      const result = outcome => ({battle, events, outcome: outcome || null});\n      const invalid = text => {\n        events.push(event('invalid', text));\n        return result(null);\n      };\n      if (battle.phase === 'end') return result(null);\n      if (!action || typeof action.kind !== 'string') return invalid('Choose an action.');\n      if (battle.phase === 'forced-switch' && action.kind !== 'switch') {\n        return invalid('Choose a healthy companion first.');\n      }\n      if (!['action', 'forced-switch'].includes(battle.phase)) return invalid('The battle is not ready.');\n\n      // Optional release modules can add actions without embedding their rules in\n      // every game. Standard actions and validation retain ownership here.\n      const standardActions=['move','switch','run','capture','healItem'];\n      const customAction=!standardActions.includes(action.kind)&&options.actions?.[action.kind];\n      if(typeof customAction==='function')return customAction({\n        battle,action,events,result,invalid,\n        active:side=>active(battle,side),definition,maxHp,\n        emit:(type,text,extra)=>events.push(event(type,text,extra)),\n        useMove:(side,move)=>executeMove(battle,side,move.id,events,move),\n        enemyTurn:()=>executeMove(battle,'enemy',enemyMove(battle),events)\n      });\n\n      if (action.kind === 'switch') {\n        const index = action.index;\n        if (!Number.isInteger(index) || index < 0 || index >= battle.playerParty.length ||\n            index === battle.playerIndex || battle.playerParty[index].hp <= 0) {\n          return invalid('Choose a different healthy companion.');\n        }\n        const forced = battle.phase === 'forced-switch';\n        battle.playerIndex = index;\n        battle.playerGuard = false;\n        battle.phase = 'action';\n        const next = active(battle, 'player');\n        if (!battle.participants.includes(next.uid)) battle.participants.push(next.uid);\n        events.push(event('switch', `Go, ${name(next)}!`, {side: 'player', index, forced}));\n        if (forced) return result(null);\n        battle.turn++;\n        return result(executeMove(battle, 'enemy', enemyMove(battle), events));\n      }\n\n      if (action.kind === 'run') {\n        if (battle.kind !== 'wild') return invalid('Finish this trainer battle before leaving.');\n        battle.turn++;\n        return result(finish(battle, 'run', events));\n      }\n\n      if (action.kind === 'capture') {\n        if (battle.kind !== 'wild') return invalid('You cannot capture a trainer\u2019s creature.');\n        if (!Number.isFinite(action.balls) || action.balls < 1) return invalid('You have no Capture Orbs left.');\n        battle.ballsUsed++;\n        battle.turn++;\n        events.push(event('throw', 'You throw a Capture Orb.', {ballsUsed: 1}));\n        const enemy = active(battle, 'enemy');\n        const chance = 0.22 + (1 - enemy.hp / maxHp(enemy)) * 0.7;\n        if (roll() < chance) return result(finish(battle, 'capture', events, enemy));\n        events.push(event('break-free', `${name(enemy)} broke free!`));\n        return result(executeMove(battle, 'enemy', enemyMove(battle), events));\n      }\n\n      if (action.kind === 'healItem') {\n        if (!Number.isFinite(action.potions) || action.potions < 1) return invalid('You have no potions left.');\n        const mon = active(battle, 'player');\n        if (mon.hp >= maxHp(mon)) return invalid('This companion is already at full health.');\n        battle.potionsUsed++;\n        battle.turn++;\n        const restored = Math.min(maxHp(mon) - mon.hp, Math.max(25, Math.floor(maxHp(mon) * 0.45)));\n        mon.hp += restored;\n        events.push(event('heal-item', `${name(mon)} recovered ${restored} HP.`, {side: 'player', amount: restored, potionsUsed: 1}));\n        return result(executeMove(battle, 'enemy', enemyMove(battle), events));\n      }\n\n      if (action.kind !== 'move') return invalid('Choose a valid battle action.');\n      const chosen = moveIds(active(battle, 'player'));\n      if (!Number.isInteger(action.index) || action.index < 0 || action.index >= chosen.length) {\n        return invalid('Choose an available move.');\n      }\n      battle.turn++;\n      const playerMoveId = chosen[action.index];\n      const enemyMoveId = enemyMove(battle);\n      const priority = id => (moves[id].kind === 'guard' ? 10000 : 0);\n      const playerFirst = stat(active(battle, 'player'), 'speed') + priority(playerMoveId) >=\n        stat(active(battle, 'enemy'), 'speed') + priority(enemyMoveId);\n      const turns = playerFirst ? [['player', playerMoveId], ['enemy', enemyMoveId]] :\n        [['enemy', enemyMoveId], ['player', playerMoveId]];\n      for (const [side, moveId] of turns) {\n        const playerIndex = battle.playerIndex;\n        const enemyIndex = battle.enemyIndex;\n        const outcome = executeMove(battle, side, moveId, events);\n        if (outcome || battle.phase === 'forced-switch') return result(outcome);\n        // A replacement never inherits its fainted companion's queued attack.\n        if (battle.playerIndex !== playerIndex || battle.enemyIndex !== enemyIndex) break;\n      }\n      return result(null);\n    }\n\n    return {makeMon, maxHp, moveIds, begin, act, applyExperience, teach, xpNeeded};\n  }\n\n  return {create};\n})();\n\nif (typeof module !== 'undefined' && module.exports) module.exports = Combat;\n<\/script>\n<script>/* Echo Ruins has no browser dependencies.  Keep this file usable by the demo\n * and by headless tests: every command returns a new, normalized state. */\nconst EchoRuins = (() => {\n  'use strict';\n\n  const VERSION = 1;\n  const RELEASE = 'echo-ruins-demo';\n  const WIDTH = 21, HEIGHT = 13;\n  const SPECIES = ['octopus', 'minotaur', 'siren', 'nautilus'];\n  const DIRECTIONS = {\n    north: {x: 0, y: -1}, east: {x: 1, y: 0},\n    south: {x: 0, y: 1}, west: {x: -1, y: 0}\n  };\n  const DEFAULT_OWNED = ['octopus', 'minotaur', 'siren'];\n  const SPAWNS = {\n    landing: {x: 3, y: 6, facing: 'east'},\n    courtyard: {x: 2, y: 6, facing: 'east'},\n    gallery: {x: 2, y: 6, facing: 'east'}\n  };\n  const COMMAND_ALIASES = Object.freeze({\n    walk: 'move', choose: 'select', deploy: 'place', turn: 'face',\n    activate: 'use', return: 'recall', examine: 'interact', reset: 'resetRoom'\n  });\n\n  const rooms = Object.freeze({\n    landing: Object.freeze({id: 'landing', name: 'Aegean Landing'}),\n    courtyard: Object.freeze({id: 'courtyard', name: 'Mar y);c.lineTo(x-9,y-9);c.lineTo(x-5,y);c.lineTo(x-9,y+9);c.closePath();c.fill();c.stroke()}\n    if(index>=2){const amplified=frame?.amplified||index>=5;c.lineWidth=amplified?7:4;c.strokeStyle=amplified?'#ffd94f':'#9de8da';c.setLineDash([12,8]);c.beginPath();c.moveTo(sirenX+32,y);c.lineTo(amplified?445:205,y);c.stroke();c.setLineDash([]);}\n    if(index===2){c.fillStyle='#a13f36';c.font='900 24px system-ui';c.fillText('fades',190,122)}\n  }\n\n  function finishDemo(){if(demo?.timer)clearInterval(demo.timer);demo=null;markTutorialSeen();closeModal();setFeedback('Your turn: place companions beside you, turn their arrows, and use their powers. The landing objects are safe practice.')}\n\n  function openGuide(){\n    modalMode='guide';els.overlay.hidden=false;els.modal.className='panel';\n    els.modal.innerHTML=`<div class=\"eyebrow\">Always available<\/div><h2 id=\"modalTitle\">Field guide<\/h2><p>Every power uses the same rhythm: <b>choose \u2192 place beside you \u2192 turn \u2192 use<\/b>.<\/p><div class=\"guide-grid\">${Object.entries(SPECIES).map(([id,m])=>`<div class=\"guide-card\"><b>${m.name} \u00b7 ${m.verb}<\/b><p>${m.detail}.<\/p><\/div>`).join('')}<div class=\"guide-card\"><b>Move & interact<\/b><p>WASD/arrows move. E interacts. Tap the map to place on an adjacent tile.<\/p><\/div><div class=\"guide-card\"><b>Correct a setup<\/b><p>Q recalls. Undo reverses spatial actions in this room. Reset restores room objects without removing rewards.<\/p><\/div><\/div><div class=\"choices\"><button class=\"primary\" data-guide=\"demo\">Replay Professor demo<\/button><button data-guide=\"close\">Back to ruins<\/button><\/div>`;\n    els.modal.querySelector('[data-guide=\"demo\"]').addEventListener('click',startDemo);els.modal.querySelector('[data-guide=\"close\"]').addEventListener('click',closeModal);\n  }\n\n  function hintText(){\n    const status=view.status||{};\n    const hints={landing:[\n      'The floating target and wooden crate are safe places to test powers.' ort\">Export<\/button><\/div><div class=\"menu-row\"><div><b>Import progress<\/b><small>Only version 1 Echo Ruins saves are accepted.<\/small><\/div><button data-menu=\"import\">Import<\/button><\/div><div class=\"menu-row\"><div><b>Restart local demo<\/b><small>Clears only this demo\u2019s local save and starts at the landing.<\/small><\/div><button class=\"danger\" data-menu=\"restart\">Restart<\/button><\/div><div class=\"choices\"><button class=\"primary\" data-menu=\"close\">Back to ruins<\/button><\/div>`;\n    els.modal.querySelectorAll('[data-menu]').forEach(button=>button.addEventListener('click',()=>menuAction(button.dataset.menu)));\n  }\n\n  function menuAction(action){\n    if(action==='close'){closeModal();return}if(action==='export'){exportSave();return}if(action==='import'){els.importInput.value='';els.importInput.click();return}\n    if(action==='restart'){try{localStorage.removeItem(SAVE_KEY)}catch(_){}state=EchoRuins.fresh();state=EchoRuins.normalize({...state,party:newParty()})||EchoRuins.fresh();view=EchoRuins.view(state);undoStack=[];feedbackText='A fresh expedition begins at Aegean Landing.';save();closeModal();render();openWelcome()}\n  }\n\n  function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='echo-ruins-save-v1.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Echo Ruins save exported.')}\n  async function importSave(){const file=els.importInput.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!inRelease(parsed))throw new Error('wrong release');const normalized=EchoRuins.normalize(parsed);if(!normalized||!inRelease(normalized))throw new Error('invalid');state=normalized;if(!validParty(state.party))state=EchoRuins.normalize({...state,party:newParty()})||EchoRuins.fresh();view=EchoRuins.view(state);undoStack=[];save();closeModal();render();toast('Echo Ruins progress imported.')}catch(_){toast('That file is not a valid Echo Ruins version 1 save.')}}\n\n  function closeModal(){if(demo?.timer)clearInterval(demo.timer);if(modalMode==='demo')demo=null;if(modalMode!=='battle'){modalMode=null;els.overlay.hidden=true;els.canvas.focus()}}\n\n  function startBattle(checkpoint){\n    if(!battleEngine){setFeedback('The Nautilus is curious, but the battle module is unavailable in this build.');return}\n    battleCheckpoint=clone(checkpoint);battleStartingInventory={balls:state.balls,potions:state.potions};\n    if(!validParty(state.party))state={...state,party:newParty()};\n    try{battle=battleEngine.begin(state.party,{kind:'wild',enemyTeam:[{species:'nautilus',level:4}]})}catch(_){battle=null;setFeedback('The recovery spring restored your field team. Try approaching Nautilus again.');return}\n    modalMode='battle';els.overlay.hidden=false;renderBattle(['A wild Nautilus rises from the tidepool! Weaken it, then use an Echo Orb.']);\n  }\n\n  function activeMon(side){if(!battle)return null;const party=side==='player'?battle.playerParty:battle.enemyParty;const index=side==='player'?battle.playerIndex:battle.enemyIndex;return party[index]}\n  function monName(mon){return battleEngine?.content?.species?.[mon.species]?.name||SPECIES[mon.species]?.name||mon.species}\n  function hpPercent(mon){return Math.max(0,Math.min(100,mon.hp/battleEngine.maxHp(mon)*100))}\n\n  function renderBattle(messages=[]){\n    if(!battle)return;const ally=activeMon('player'),enemy=activeMon('enemy');const balls=Math.max(0,battleStartingInventory.balls-(battle.ballsUsed||0));const potions=Math.max(0,battleStartingInventory.potions-(battle.potionsUsed||0));\n    els.modal.className='panel battle-card';els.modal.innerHTML=`<div class=\"eyebrow\">Tidepool encounter \u00b7 friendly and repeatable<\/div><h2 id=\"modalTitle\">Befriend Nautilus<\/h2><div class=\"battle-top\"><div class=\"fighter\"><img src=\"${ASSETS[ally.species]||''}\" alt=\"${monName(ally)}\">< );return}command={kind:'switch',index:options[0].index}}\n    const result=battleEngine.act(battle,command);battle=result.battle;const messages=(result.events||[]).map(event=>event.text).filter(Boolean);\n    if(result.outcome){finishBattle(result.outcome,messages);return}renderBattle(messages);\n  }\n\n  function restoredParty(party){return (party||state.party).map(mon=>({...mon,hp:battleEngine.maxHp(mon)}))}\n  function finishBattle(outcome,messages){\n    const balls=Math.max(0,battleStartingInventory.balls-(battle.ballsUsed||0));const potions=Math.max(0,battleStartingInventory.potions-(battle.potionsUsed||0));let party=outcome.party||battle.playerParty;const caught=outcome.type==='capture';if(caught&&outcome.captured&&party.length<6)party=[...party,outcome.captured];party=restoredParty(party);\n    battle=null;modalMode=null;els.overlay.hidden=true;const result=EchoRuins.step(state,{type:'battleResult',outcome:caught?'caught':'missed',party,balls,potions});state=result.state;view=EchoRuins.view(state);undoStack=[];save();render();setFeedback(caught?'Nautilus joined your companions! Select it with 4 and use Amplify on Siren\u2019s sound.':`${messages.join(' ')||'The encounter ended.'} Nautilus will wait safely at the tidepool.`);toast(caught?'Nautilus befriended!':'You can return to Nautilus whenever you are ready.');battleCheckpoint=null;battleStartingInventory=null;els.canvas.focus({preventScroll:true});\n  }\n\n  function openFinish(){\n    modalMode='finish';els.overlay.hidden=false;els.modal.className='panel';els.modal.innerHTML=`<div class=\"eyebrow\">Echo Ruins complete<\/div><h1 id=\"modalTitle\">The tidepool shines again<\/h1><p>You opened the ruins with companion field powers, recovered the Tideglass Ornament, and installed it at the landing display.<\/p><div class=\"note\">Keep exploring or reset any room to test a different solution. Your capture and ornament remain safe.<\/div><div class=\"choices\"><button class=\"primary\" data-finish=\"back\">Keep uide\"><\/section><\/div><input id=\"importInput\" type=\"file\" accept=\"application/json,.json\" hidden><script>const ECHO_ASSETS = {\"pug\": \"../../assets/b0991b363e363dae322ffef642a504057604bc58c07b64a37b0c0ff8619506f9.png\", \"octopus\": \"../../assets/87c4a51b9af12bf79395e81c0f2cd11c0534b6aa9b553d9e514d460a6f3669c6.png\", \"minotaur\": \"../../assets/2e225617fb11469b161ff1d34936b0de223ecd56274ea4c6cd9f5794e06142ab.png\", \"siren\": \"../../assets/62e5d178c154a36e799cce167d6c10a663a0434eec0adb1edbdcbef6a5a1d0dd.png\", \"nautilus\": \"../../assets/b51f5f95e1eaf5745ff8b42c0286ffa87a8b40a1574849959c68f9614520873c.png\", \"professor\": \"../../assets/eb209755957154d301d41ed7dc6a389f01f4b5729103f9810468aa672a13a147.png\", \"rockman\": \"../../assets/276d100b62c5c2fe0a3933b975ccb5e31202fa7b67b8d671c694497f7095b099.png\"};<\/script><script>/* Wild Encounters: pure encounter rules plus a small, dependency-free browser shell. */\nconst WildEncounters = (() => {\n  'use strict';\n  const VERSION = 2;\n  const RELEASE = 'wild-encounters-demo';\n  const AREAS = Object.freeze({\n    pug: {id:'pug', name:'Toygrass Terrace', creature:'pug', goal:'Watch how Pug reacts near the marble path.'},\n    octopus: {id:'octopus', name:'Blue Channel', creature:'octopus', goal:'The channel is blocked near the quiet bank.'},\n    nautilus: {id:'nautilus', name:'Shell Cove', creature:'nautilus', goal:'An exposed shell shelter needs care.'}\n  });\n  const ORDER = ['pug','octopus','nautilus'];\n  const DIRECTION = Object.freeze({north:{x:0,y:-1},east:{x:1,y:0},south:{x:0,y:1},west:{x:-1,y:0}});\n  const SPAWNS = Object.freeze({pug:{x:3,y:7},octopus:{x:3,y:7},nautilus:{x:3,y:7}});\n  const CREATURES = Object.freeze({\n    pug:{x:12,y:6, ring:3, conditions:['toyPlaced','spaceGiven'], environment:'toyPlaced', distance:'spaceGiven', target:{x:8,y:6,label:'soft thyme patch'}},\n    octopus:{x:13,y:6, ring:3, conditions:['channelCleared','quietBank'], environment:'channelCleared', distance:'quietBank', target:{x:9,y:6,label:'blocked channel'}},\n    nautilus:{x:13,y:6, ring:3, conditions:['shelterRestored','spaceGiven'], environment:'shelterRestored', distance:'spaceGiven', target:{x:9,y:6,label:'loose shelter shells'}}\n  });\n  const clone = value => JSON.parse(JSON.stringify(value));\n  const validArea = value => Object.prototype.hasOwnProperty.call(AREAS, value);\n  const validDirection = value => Object.prototype.hasOwnProperty.call(DIRECTION, value);\n  const message = (kind, text, extra) => Object.assign({kind, text}, extra || {});\n  const count = value => Object.values(value).filter(Boolean).length;\n\n  function habitat() { return {observed:false, toyPlaced:false, spaceGiven:false, channelCleared:false, quietBank:false, shelterRestored:false, comfort:0, setbacks:0}; }\n  function fresh() {\n    return {version:VERSION, release:RELEASE, area:'pug', player:{x:3,y:7,facing:'east'}, time:0,\n      tutorial:'intro', friendships:{pug:false,octopus:false,nautilus:false}, habitats:{pug:habitat(),octopus:habitat(),nautilus:habitat()}};\n  }\n  function normalize(raw) {\n    if (!raw || typeof raw !== 'object' || raw.version !== VERSION || raw.release !== RELEASE) return null;\n    const state = fresh();\n    state.area = validArea(raw.area) ? raw.area : state.area;\n    const player = raw.player || {};\n    state.player = {x:Number.isInteger(player.x) && player.x >= 1 && player.x <= 15 ? player.x : SPAWNS[state.area].x,\n      y:Number.isInteger(player.y) && player.y >= 1 && player.y <= 9 ? player.y : SPAWNS[state.area].y,\n      facing:validDirection(player.facing) ? player.facing : 'east'};\n    state.time = Number.isInteger(raw.time) && raw.time >= 0 && raw.time <= 9999 ? raw.time : 0;\n    state.tutorial = ['intro','demo','practice','complete'].includes(raw.tutorial) ? raw.tutorial : 'intro';\n    for (const id of ORDER) {\n      const saved = raw.habitats && raw.habitats[id] || {};\n      const target = CREATURES[id];\n      state.friendships[id] = raw.friendships && raw.friendships[id] === true;\n      state.habitats[id].observed = saved.observed === true;\n      for (const key of target.conditions) state.habitats[id][key] = saved[key] === true;\n      state.habitats[id].comfort = Number.isInteger(saved.comfort) && saved.comfort >= 0 && saved.comfort <= 2 ? saved.comfort : 0;\n      state.habitats[id].setbacks = Number.isInteger(saved.setbacks) && saved.setbacks >= 0 && saved.setbacks <= 99 ? saved.setbacks : 0;\n      if (state.friendships[id]) { for (const key of target.conditions) state.habitats[id][key] = true; state.habitats[id].comfort = 2; }\n    }\n    if (state.friendships.pug && state.tutorial !== 'complete') state.tutorial = 'complete';\n    return state;\n  }\n  function active(state) { return state.habitats[state.area]; }\n  function creature(state) { return CREATURES[state.area]; }\n  function conditionsMet(state) { const h = active(state), c = creature(state); return c.conditions.every(key => h[key]); }\n  function distanceToCreature(state) { const c = creature(state), p = state.player; return Math.abs(p.x-c.x)+Math.abs(p.y-c.y); }\n  function insideComfortRing(state) { return distanceToCreature(state) <= creature(state).ring; }\n  function nearCreature(state) { return distanceToCreature(state) <= 7; }\n  function nearEnvironment(state) { const t = creature(state).target, p = state.player; return Math.abs(p.x-t.x)+Math.abs(p.y-t.y) <= 1; }\n  function inWatchingBand(state) { const distance = distanceToCreature(state); return distance > creature(state).ring && distance <= 7; }\n  function isWalkable(source, x, y) {\n    const state=normalize(source); if (!state || x < 1 || x > 15 || y < 1 || y > 9) return false;\n    return !((state.area === 'octopus' || state.area === 'nautilus') && x >= 11 && y >= 2 && y <= 8);\n  }\n  function nextState(state, change) { const result = normalize(state) || fresh(); change(result); return normalize(result) || fresh(); }\n  function behavior(state, id) {\n    if (state.friendships[id]) return id === 'pug' ? 'visiting camp' : id === 'octopus' ? 'curling a friendly tentacle at camp' : 'resting safely at camp';\n    const h = state.habitats[id];\n    if (h.setbacks && h.comfort === 0) return id === 'pug' ? 'Pug ducks behind thyme after the sudden step' : id === 'octopus' ? 'Octopus tucks behind a stone after the noisy moment' : 'Nautilus slips behind its shell after the close step';\n    if (id === 'pug') return h.toyPlaced && h.spaceGiven ? 'trotting toward the toy from a calm distance' : h.toyPlaced ? 'sniffing the toy and checking your distance' : 'pawing an empty thyme patch';\n    if (id === 'octopus') return h.channelCleared && h.quietBank ? 'gliding through the open channel from the quiet bank' : h.channelCleared ? 'testing the newly clear channel' : 'bumping the reed-blocked channel, then slipping back';\n    return h.shelterRestored && h.spaceGiven ? 'emerging beside the restored shelter' : h.shelterRestored ? 'settling by its sheltered shell' : 'retreating from open water beside loose shelter shells';\n  }\n  function step(source, command) {\n    const state = normalize(source) || fresh();\n    const action = command && command.type;\n    const response = {state, events:[]};\n    if (!action) { response.events.push(message('info','Choose an action when you are ready.')); return response; }\n    let event;\n    const moved = action === 'move' || ['observe','environment','space','approach'].includes(action);\n    response.state = nextState(state, next => {\n      if (moved) next.time += 1;\n      const resetComfort = h => { h.comfort=0; h.spaceGiven=false; h[creature(next).distance]=false; h.setbacks+=1; };\n      const setback = text => { const h = active(next); resetComfort(h); event=message('wrong',`${text} Comfort resets, but helpful habitat changes stay.`); };\n      if (action === 'move') {\n        const direction = command.direction;\n        if (!validDirection(direction)) { event = message('wrong','That direction is not available.'); return; }\n        next.player.facing = direction;\n        const d = DIRECTION[direction], x = next.player.x + d.x, y = next.player.y + d.y;\n        if (!isWalkable(next,x,y)) event = message('wrong',(x < 1 || x > 15 || y < 1 || y > 9) ? 'A low marble wall marks the edge of this habitat.' : 'The water begins beyond this sandy bank.');\n        else { next.player.x=x; next.player.y=y; if (insideComfortRing(next)) { const h=active(next); resetComfort(h); event=message('wrong',`${next.area==='pug'?'Pug backs behind the thyme.':next.area==='octopus'?'Octopus folds into a crevice.':'Nautilus slips behind its shell.'} You are inside the red comfort ring.`); } else event=message('move','You take a quiet step.'); }\n        return;\n      }\n      if (action === 'travel') {\n        if (!validArea(command.area)) { event=message('wrong','That habitat is not on the field map.'); return; }\n        next.area=command.area; next.player=Object.assign({facing:'east'},SPAWNS[command.area]); event=message('move',`You arrive at ${AREAS[command.area].name}.`); return;\n      }\n      if (action === 'tutorial') {\n        if (command.stage === 'demo') { next.tutorial='demo'; event=message('tutorial','Professor Thales places a soft toy. Pug sniffs it, then pauses when he steps back.'); }\n        else if (command.stage === 'practice') { next.tutorial='practice'; next.area='pug'; next.player={x:7,y:6,facing:'east'}; event=message('tutorial','Your turn: use Observe from the turquoise watching band. There is no hurry.'); }\n        else if (command.stage === 'complete') { next.tutorial='complete'; event=message('tutorial','The guide stays available from the Field guide button.'); }\n        else event=message('wrong','Choose the next guide card.');\n        return;\n      }\n      const h = active(next), id = next.area, c = creature(next);\n      if (action === 'observe') {\n        if (!nearCreature(next)) { event=message('info','You cannot read the signal from here. Walk into the turquoise watching band, then observe.'); return; }\n        h.observed = true;\n        if (next.tutorial === 'practice' && id === 'pug') next.tutorial='complete';\n        event = message('right', id === 'pug' ? 'Pug checks the path, then looks at anything soft left nearby.' : id === 'octopus' ? 'The Octopus keeps one eye on the narrow channel and another on the bank.' : 'Nautilus stays close to a place where its shell can rest safely.');\n        return;\n      }\n      if (action === 'environment') {\n        if (!nearEnvironment(next)) { setback(`The useful place is nearby, but not here. Look for the marked ${c.target.label}.`); return; }\n        h[c.environment] = true;\n        event = message('right', id === 'pug' ? 'You set down the soft toy without tossing it. Pug notices.' : id === 'octopus' ? 'You clear reeds from the channel. Water can pass again.' : 'You fit the loose shell pieces into a shaded shelter.');\n        return;\n      }\n      if (action === 'space') {\n        if (!inWatchingBand(next)) { setback(insideComfortRing(next) ? 'The creature needs more room before it can settle.' : 'Step close enough to watch, but stay outside the red comfort ring.'); return; }\n        h.spaceGiven = true; h[c.distance] = true; h.comfort=2;\n        event = message('right', id === 'octopus' ? 'You wait on the quiet bank. The water settles.' : 'You make room and wait without following.');\n        return;\n      }\n      if (action === 'approach') {\n        if (!inWatchingBand(next)) { setback(insideComfortRing(next) ? 'You stepped inside the comfort ring instead of waiting for an approach.' : 'Move to the turquoise watching band before waiting.'); return; }\n        if (conditionsMet(next)) { next.friendships[id]=true; h.comfort=2; const allFriends=count(next.friendships)===ORDER.length; event=message('friend',`${id === 'pug' ? 'Pug trots' : id === 'octopus' ? 'Octopus glides' : 'Nautilus emerges'} over by choice. ${allFriends?'All three friends chose camp \u2014 field study complete!':'A new friend joins the camp!'}`,{friend:id,complete:allFriends}); }\n        else setback('They are not ready yet. Watch their signal, help the marked place, then give space.');\n        return;\n      }\n      event=message('wrong','That field action is not available.');\n    });\n    response.events.push(event || message('info','The habitat stays calm.'));\n    return response;\n  }\n  function view(source) {\n    const state = normalize(source) || fresh(), h = active(state), c = creature(state);\n    return {version:VERSION, release:RELEASE, state:clone(state), area:AREAS[state.area],\n      behavior:behavior(state,state.area), near:nearCreature(state), ready:conditionsMet(state), complete:count(state.friendships) === ORDER.length,\n      distance:distanceToCreature(state), insideRing:insideComfortRing(state), nearEnvironment:nearEnvironment(state), watchingBand:inWatchingBand(state), target:clone(c.target), hint:h.setbacks >= 2 ? (state.area === 'pug' ? 'Pug keeps pawing the marked thyme patch. A calm watcher helps after a soft toy is set down.' : state.area === 'octopus' ? 'The marked reeds block the channel. Clear them, then wait from the quiet bank.' : 'The marked loose shells can make a shaded shelter. Then wait outside the ring.') : null,\n      progress:{friends:count(state.friendships), total:ORDER.length, currentConditions:c.conditions.map(key=>({key,done:h[key]}))},\n      camp:ORDER.map(id=>({id,friend:state.friendships[id],behavior:behavior(state,id)}))};\n  }\n  function demoFrames() { return [\n    {stage:'notice', pug:'pawing an empty thyme patch'}, {stage:'toy', pug:'sniffing a softly placed toy'},\n    {stage:'space', pug:'relaxing while Professor Thales steps back'}, {stage:'practice', pug:'waiting for a careful observer'}\n  ]; }\n  return {VERSION, RELEASE, AREAS, fresh, normalize, step, view, demoFrames, behavior, distanceToCreature, insideComfortRing, nearEnvironment, isWalkable};\n})();\nif (typeof module !== 'undefined' && module.exports) module.exports = WildEncounters;\n\n/* The rest of this file only runs in the self-contained browser demo. */\nif (typeof window !== 'undefined' && typeof document !== 'undefined') (() => {\n  'use strict';\n  const Core = WildEncounters, SAVE_KEY='fakemon-wild-encounters-v2';\n  const $ = id => document.getElementById(id);\n  let state=Core.fresh(), last='Professor Thales is ready to show a careful field method.', modalMode='';\n  const esc = text => String(text).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const assets = () => typeof ECHO_ASSETS !== 'undefined' ? ECHO_ASSETS : (window.ECHO_ASSETS || {});\n  const image = id => assets()[id];\n  const imageCache = {};\n  function spriteImage(id) {\n    const src=image(id); if (!src) return null;\n    if (!imageCache[id] || imageCache[id].getAttribute('src') !== src) { const pic=new Image(); pic.onload=()=>render(); pic.src=src; imageCache[id]=pic; }\n    return imageCache[id].complete ? imageCache[id] : null;\n  }\n  function asset(id) { const src=image(id); return src ? `<img src=\"${src}\" alt=\"\" aria-hidden=\"true\">` : `<span class=\"sprite-fallback\">${id === 'pug' ? '\ud83d\udc36' : id === 'octopus' ? '\ud83d\udc19' : id === 'nautilus' ? '\ud83d\udc1a' : '\u2605'}<\/span>`; }\n  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); return true; } catch (_) { return false; } }\n  function restore() { try { const recovered=Core.normalize(JSON.parse(localStorage.getItem(SAVE_KEY))); if (recovered) state=recovered; } catch (_) {} }\n  function run(command) { const result=Core.step(state,command); state=result.state; last=result.events[0].text; persist(); render(); }\n  function progress(){ return Core.view(state).progress; }\n  function renderNav() { const v=Core.view(state); $('habitats').innerHTML=Object.values(Core.AREAS).map(area=>`<button class=\"habitat ${area.id===state.area?' div><\/div><button id=\"closeTutorial\" class=\"primary\">Start the calm practice<\/button><\/div><\/section>\n<input id=\"importInput\" type=\"file\" accept=\"application/json,.json\" hidden><script>const ECHO_ASSETS = {\"pug\": \"../../assets/b0991b363e363dae322ffef642a504057604bc58c07b64a37b0c0ff8619506f9.png\", \"octopus\": \"../../assets/87c4a51b9af12bf79395e81c0f2cd11c0534b6aa9b553d9e514d460a6f3669c6.png\", \"minotaur\": \"../../assets/2e225617fb11469b161ff1d34936b0de223ecd56274ea4c6cd9f5794e06142ab.png\", \"siren\": \"../../assets/62e5d178c154a36e799cce167d6c10a663a0434eec0adb1edbdcbef6a5a1d0dd.png\", \"nautilus\": \"../../assets/b51f5f95e1eaf5745ff8b42c0286ffa87a8b40a1574849959c68f9614520873c.png\", \"professor\": \"../../assets/eb209755957154d301d41ed7dc6a389f01f4b5729103f9810468aa672a13a147.png\", \"rockman\": \"../../assets/276d100b62c5c2fe0a3933b975ccb5e31202fa7b67b8d671c694497f7095b099.png\"};<\/script><script>/* Temple Guardian is deliberately turn based: preview changes no encounter\n * state, and only Ready lets the guardian act. */\nconst GuardianTrial = (() => {\n  'use strict';\n  const VERSION = 1, RELEASE = 'guardian-trial-demo', STORAGE_KEY = 'fakemon.guardian-trial.v1';\n  const SIZE = 7, START = {x: 3, y: 5}, GUARDIAN = {x: 3, y: 3};\n  const dirs = {north:{x:0,y:-1}, east:{x:1,y:0}, south:{x:0,y:1}, west:{x:-1,y:0}};\n  const clone = value => JSON.parse(JSON.stringify(value));\n  const point = (x, y) => ({x, y});\n  const same = (a, b) => a && b && a.x === b.x && a.y === b.y;\n  const inside = (x, y) => Number.isInteger(x) && Number.isInteger(y) && x >= 0 && x < SIZE && y >= 0 && y < SIZE;\n  const event = (type, text, more) => Object.assign({type, text}, more || {});\n\n  function attackFor(pattern) {\n    if (pattern === 0) return {kind:'sweep', name:'Marked sweep', tiles:Array.from({length:SIZE}, (_, x) => point(x, 5)), exposed:false};\n    if (pattern === 1) return {kind:'beam', name:'Sun beam', tiles:Array.from({length:SIZE}, (_, y) => point(3, y)), exposed:false};\n    return {kind:'seal', name:'Exposed seal', tiles:[clone(GUARDIAN)], exposed:true, exposureTurns:pattern === 2 ? 2 : 1, seal:clone(GUARDIAN)};\n  }\n\n  function fresh() {\n    return {version:VERSION, release:RELEASE, turn:1, pattern:0, player:clone(START), seals:0, stumbles:0, tutorialStage:0, learned:false, complete:false, preview:null, attack:attackFor(0)};\n  }\n\n  function normalPosition(value, fallback) {\n    return value && inside(value.x, value.y) && !same(value, GUARDIAN) ? {x:value.x, y:value.y} : clone(fallback);\n  }\n\n  function normalizeState(raw, preservePreview) {\n    if (!raw || typeof raw !== 'object' || raw.version !== VERSION || raw.release !== RELEASE) return null;\n    const state = fresh();\n    state.turn = Number.isInteger(raw.turn) && raw.turn >= 1 && raw.turn <= 99 ? raw.turn : 1;\n    state.player = normalPosition(raw.player, START);\n    state.pattern = Number.isInteger(raw.pattern) && raw.pattern >= 0 && raw.pattern <= 3 ? raw.pattern : 0;\n    state.seals = Number.isInteger(raw.seals) ? Math.max(0, Math.min(3, raw.seals)) : 0;\n    state.stumbles = Number.isInteger(raw.stumbles) ? Math.max(0, Math.min(2, raw.stumbles)) : 0;\n    state.tutorialStage = Number.isInteger(raw.tutorialStage) ? Math.max(0, Math.min(3, raw.tutorialStage)) : 0;\n    state.learned = raw.learned === true || state.tutorialStage >= 3;\n    if (state.learned) state.tutorialStage = 3;\n    state.complete = raw.complete === true || state.seals >= 3;\n    if (state.complete) state.seals = 3;\n    state.preview = preservePreview && raw.preview && typeof raw.preview === 'object' ? clone(raw.preview) : null;\n    state.attack = attackFor(state.pattern);\n    return state;\n  }\n\n  // Save imports intentionally erase previews: no pending action is restored.\n  function normalize(raw) { return normalizeState(raw, false); }\n\n  function legalMove(state, to) {\n    return to && inside(to.x, to.y) && !same(to, GUARDIAN) && Math.abs(to.x - state.player.x) + Math.abs(to.y - state.player.y) === 1;\n  }\n  function adjacentToGuardian(position) { return Math.abs(position.x - GUARDIAN.x) + Math.abs(position.y - GUARDIAN.y) === 1; }\n\n  function preview(rawState, action) {\n    const state = normalizeLive(rawState), safeAction = action && typeof action === 'object' ? action : {};\n    if (state.complete) return {state, events:[event('feedback', 'The guardian is resting. Restart only if you want another practice round.')]};\n    let checked = null, message = '';\n    if (safeAction.type === 'move' && legalMove(state, safeAction.to)) {\n      checked = {type:'move', to:{x:safeAction.to.x,y:safeAction.to.y}, path:[clone(state.player), {x:safeAction.to.x,y:safeAction.to.y}]};\n      message = 'Move previewed. Ready commits one careful step.';\n    } else if (safeAction.type === 'command' && safeAction.helper === 'rockman' && state.attack.kind === 'beam') {\n      checked = {type:'command', helper:'rockman', target:clone(state.player)};\n      message = 'Rock Man will brace against this beam when you are Ready.';\n    } else if (safeAction.type === 'strike' && state.attack.exposed && adjacentToGuardian(state.player)) {\n      checked = {type:'strike', target:clone(GUARDIAN)};\n      message = 'Seal strike previewed. The guardian\u2019s seal is exposed.';\n    } else if (safeAction.type === 'wait' && !state.attack.tiles.some(tile => same(tile, state.player))) {\n      checked = {type:'wait'};\n      message = 'Wait previewed. The marked attack will still happen after Ready.';\n    } else {\n      const reason = safeAction.type === 'command' ? 'Rock Man can block only a marked beam.' : safeAction.type === 'strike' ? 'Stand next to an exposed seal before striking.' : safeAction.type === 'wait' ? 'Hold position is only safe off the marked tiles.' : 'Choose one neighboring open tile, Rock Man, strike, or wait.';\n      return {state, events:[event('feedback', reason)]};\n    }\n    const next = clone(state); next.preview = checked;\n    return {state:next, events:[event('preview', message, {action:checked})]};\n  }\n\n  function normalizeLive(raw) { return normalizeState(raw, true) || fresh(); }\n\n  function ready(rawState) {\n    const state = normalizeLive(rawState);\n    if (state.complete) return {state, events:[event('feedback', 'The guardian has already become a friendly sleeping statue.')]};\n    if (!state.preview) return {state, events:[event('feedback', 'Preview one action first. The guardian waits while you think.')]};\n    const next = clone(state), action = next.preview, events = [event('committed', 'Ready: your preview becomes this turn\u2019s action.', {action})];\n    if (action.type === 'move') next.player = clone(action.to);\n    if (action.type === 'strike') { next.seals += 1; events.push(event('sealHit', `Seal ${next.seals} of 3 cracks with a warm echo.`, {seals:next.seals})); }\n    const blocked = action.type === 'command' && action.helper === 'rockman' && state.attack.kind === 'beam';\n    const hit = !blocked && state.attack.tiles.some(tile => same(tile, next.player));\n    next.preview = null;\n    if (next.seals >= 3) {\n      next.complete = true;\n      events.push(event('win', 'All three seals open. The guardian lowers its head and falls into a friendly sleep.'));\n      return {state:next, events};\n    }\n    if (blocked) events.push(event('blocked', 'Rock Man catches the sun beam in a stone shield.'));\n    if (hit && state.turn === 1) {\n      events.push(event('lesson', 'The first marked sweep is a harmless lesson. Now try a different tile before the beam.', {stage:0}));\n    } else if (hit) {\n      next.stumbles += 1; next.player = clone(START);\n      events.push(event('stumble', `The marked attack catches you: stumble ${next.stumbles} of 3.`, {stumbles:next.stumbles}));\n      if (next.stumbles >= 3) {\n        const learned = true;\n        const reset = fresh(); reset.learned = learned;\n        events.push(event('reset', 'Three stumbles reset the trial. Your lesson stays learned and nothing is lost.'));\n        return {state:reset, events};\n      }\n    }\n    if (!next.learned && state.turn === 1 && !hit) { next.tutorialStage = 1; events.push(event('lesson', 'Nice dodge. The next marked beam is a chance to ask Rock Man for one shield.', {stage:1})); }\n    if (!next.learned && state.attack.kind === 'beam' && blocked) { next.tutorialStage = 2; events.push(event('lesson', 'Rock Man shields your tile. Watch for the exposed seal next.', {stage:2})); }\n    if (!next.learned && action.type === 'strike') { next.tutorialStage = 3; next.learned = true; events.push(event('lesson', 'You found the seal. The rest of the trial is yours to explore.', {stage:3})); }\n    next.turn += 1;\n    if (state.attack.kind === 'sweep') next.pattern = 1;\n    else if (state.attack.kind === 'beam') next.pattern = 2;\n    else if (action.type === 'strike' || state.pattern === 3) next.pattern = 0;\n    else next.pattern = 3;\n    next.attack = attackFor(next.pattern);\n    events.push(event('telegraph', `Next: ${next.attack.name}. Choose one action, then press Ready.`, {attack:clone(next.attack)}));\n    return {state:next, events};\n  }\n\n  function restart(rawState) {\n    const old = normalizeLive(rawState), next = fresh(); next.learned = old.learned;\n    return {state:next, events:[event('reset', 'The Guardian Trial is ready again.')]};\n  }\n  function step(state, command) {\n    const action = command && typeof command === 'object' ? command : {};\n    if (action.type === 'preview') return preview(state, action.action);\n    if (action.type === 'ready') return ready(state);\n    if (action.type === 'restart') return restart(state);\n    return {state:normalizeLive(state), events:[event('feedback', 'Choose one preview action, then Ready.')]};\n  }\n\n  function view(rawState) {\n    const state = normalizeLive(rawState);\n    return {\n      size:SIZE, state:clone(state), guardian:clone(GUARDIAN),\n      attack:clone(state.attack), objective: state.complete ? 'The guardian is safe and sleeping.' : state.seals ? `Find another exposed seal (${state.seals}/3).` : 'Dodge, block, and strike when a seal is exposed.',\n      legalMoves:Object.values(dirs).map(delta => point(state.player.x + delta.x, state.player.y + delta.y)).filter(to => legalMove(state, to)),\n      actions:{move:true, command:state.attack.kind === 'beam', strike:state.attack.exposed && adjacentToGuardian(state.player), wait:!state.attack.tiles.some(tile => same(tile, state.player)), ready:!!state.preview}\n    };\n  }\n\n  function exportText(rawState) { return JSON.stringify(normalize(rawState) || fresh()); }\n  function importText(text) { try { return normalize(JSON.parse(text)); } catch (_) { return null; } }\n  return Object.freeze({VERSION, RELEASE, STORAGE_KEY, fresh, normalize, preview, ready, restart, step, view, exportText, importText});\n})();\n\nif (typeof module !== 'undefined' && module.exports) module.exports = GuardianTrial;\n\n/* Browser layer. The core above remains usable in Node without document. */\nif (typeof document !== 'undefined') (() => {\n  const $ = selector => document.querySelector(selector);\n  const browserDirs = {north:{x:0,y:-1}, east:{x:1,y:0}, south:{x:0,y:1}, west:{x:-1,y:0}};\n  const browserClone = value => JSON.parse(JSON.stringify(value));\n  const canvas = $('#guardianBoard');\n  if (!canvas) return;\n  const ctx = canvas.getContext('2d');\n  let state = load() || GuardianTrial.fresh();\n  if (state.learned) $('#tutorial').hidden = true;\n  let feedback = 'The guardian shows its next attack. It waits while you choose.';\n  const asset = typeof ECHO_ASSETS !== 'undefined' ? ECHO_ASSETS : {};\n  const images = {};\n  for (const id of ['rockman','minotaur','octopus','nautilus','siren','professor']) if (asset[id]) { images[id] = new Image(); images[id].addEventListener('load', draw); images[id].src = asset[id]; }\n  if (asset.rockman) {\n    const helperIcon = document.createElement('img');\n    helperIcon.className = 'helper-icon'; helperIcon.src = asset.rockman; helperIcon.alt = '';\n    $('#rockBtn').prepend(helperIcon);\n  }\n\n  function load() { try { return GuardianTrial.importText(localStorage.getItem(GuardianTrial.STORAGE_KEY) || ''); } catch (_) { return null; } }\n  function persist() { try { localStorage.setItem(GuardianTrial.STORAGE_KEY, GuardianTrial.exportText(state)); } catch (_) {} }\n  function colorTile(x, y, tile) {\n    const attack = GuardianTrial.view(state).attack.tiles.some(p => p.x === x && p.y === y);\n    ctx.fillStyle = attack ? '#c96847' : (x + y) % 2 ? '#e8d3a0' : '#f6e8bd';\n    ctx.fillRect(tile * x, tile * y, tile, tile);\n    ctx.strokeStyle = '#a68555'; ctx.lineWidth = 2; ctx.strokeRect(tile*x+1,tile*y+1,tile-2,tile-2);\n    if (!attack && ((x * 5 + y * 3) % 7 === 1 || (x * 2 + y * 5) % 11 === 2)) {\n      const px=x*tile, py=y*tile;\n      ctx.strokeStyle='rgba(132,104,69,.32)';ctx.lineWidth=Math.max(1,tile*.012);ctx.beginPath();\n      if((x+y)%2){ctx.moveTo(px+tile*.16,py+tile*.08);ctx.lineTo(px+tile*.31,py+tile*.22);ctx.lineTo(px+tile*.25,py+tile*.39);}\n      else{ctx.moveTo(px+tile*.86,py+tile*.18);ctx.lineTo(px+tile*.69,py+tile*.31);ctx.lineTo(px+tile*.76,py+tile*.51);}\n      ctx.stroke();\n    }\n  }\n  function drawSprite(id, p, tile, fallback) {\n    const image = images[id], x = p.x * tile, y = p.y * tile;\n    if (image && image.complete && image.naturalWidth) { ctx.drawImage(image, x+4,y+4,tile-8,tile-8); return; }\n    ctx.fillStyle=fallback;ctx.fillRect(x+tile*.23,y+tile*.19,tile*.54,tile*.62);ctx.fillStyle='#fff6d2';ctx.fillRect(x+tile*.36,y+tile*.28,tile*.1,tile*.1);ctx.fillRect(x+tile*.57,y+tile*.28,tile*.1,tile*.1);\n  }\n  function drawGuardian(v, tile) {\n    const x=v.guardian.x*tile, y=v.guardian.y*tile, cx=x+tile*.5;\n    const exposed=v.attack.exposed && !state.complete;\n    ctx.save();\n    // The outlined center tile is the guardian's complete collision footprint.\n    c

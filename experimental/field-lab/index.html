field-actions{display:none}#guideBtn,#undoBtn{display:none}}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\n<\/style>\n<style data-game-ui=\"pixel\">/* Shared handheld-inspired chrome. World and creature palettes are independent. */\n:root{\n  --ink:#24283b;--muted:#626478;--paper:#fff8e7;--cream:#e7dcc1;\n  --line:#77788c;--sea:#3159ae;--sea2:#5278c5;--gold:#e5b854;\n  --red:#ab472f;--green:#488760;--deep:#191c30;--foam:#e5eafb;\n  --marble:#e7dcc1;--shadow:#171a2a;--radius:0px;\n  --ui-text:Verdana,\"Trebuchet MS\",Arial,sans-serif;\n  --ui-label:\"Lucida Console\",Monaco,\"Courier New\",monospace;\n  color-scheme:light;\n}\nbody{font-family:var(--ui-text);background-image:none}\nbutton,input,select,summary{font-family:inherit}\nbutton,.shell,.game-shell,.panel,.card,.moncard,.guide-card,.fighter,\n.overlay,.note,.toast,#toast,.chip,.type,.bar,.hp,.portrait,.caption,\n.context,.feedback,.status,.step,.victory,.map-node,.battle-tag,\n#battleLog,.battle-log,.progress,.map-label,#interactionHint,kbd{border-radius:0!important}\nbutton:focus-visible,a:focus-visible,summary:focus-visible,canvas:focus-visible{\n  outline:3px solid var(--sea);outline-offset:3px;\n}\nbutton:disabled{cursor:default}\nimg,canvas{image-rendering:pixelated}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n/* Keep direction pads spatially consistent with the map on touch screens. */\n.dpad [data-dir=\"north\"]{grid-row:1;grid-column:2}\n.dpad [data-dir=\"west\"]{grid-row:2;grid-column:1}\n.dpad [data-dir=\"south\"]{grid-row:2;grid-column:2}\n.dpad [data-dir=\"east\"]{grid-row:2;grid-column:3}\n<\/style><\/head>\n<body>\n<div id=\"app\">\n  <header class=\"mast\"><div class=\"seal\" aria-hidden=\"true\">\u03a9<\/div><div class=\"title\"><span>A Fakemon field expedition<\/span><b>Echo Ruins<\/b><\/div><button id=\"guideBtn\">Guide<\/button><button id=\"menuBtn\">Save<\/button><\/header>\n  <main class=\"shell\">\n    <div class=\"mission\"><div class=\"room\" id=\"roomName\">Aegean Landing<\/div><div class=\"goal\" id=\"objective\">Meet the professor and explore the ruins.<\/div><div class=\"mission-actions\"><button id=\"hintBtn\">Hint<\/button><button id=\"undoBtn\">Undo<\/button><button id=\"resetBtn\">Reset<\/button><\/div><\/div>\n    <div class=\"play\">\n      <section class=\"stage\" id=\"stage\"><canvas id=\"world\" width=\"1008\" height=\"624\" tabindex=\"0\" aria-label=\"Echo Ruins map. Use arrow keys or WASD to explore.\"><\/canvas><div class=\"map-label\" id=\"mapLabel\">Aegean Landing<\/div><div class=\"context\" id=\"contextHint\">Move with WASD or the arrow buttons.<\/div><\/section>\n      <aside class=\"side\" aria-label=\"Companion field controls\">\n        <h2>Choose a companion<\/h2><div class=\"companions\" id=\"companions\"><\/div>\n        <div class=\"inventory\"><span class=\"chip\" id=\"orbCount\">8 Echo Orbs<\/span><span class=\"chip\" id=\"potionCount\">3 Tonics<\/span><\/div>\n        <div class=\"field-actions\" aria-label=\"Field actions\"><button id=\"placeBtn\">Place ahead <small>P<\/small><\/button><button id=\"useBtn\" class=\"primary\">Use power <small>Space<\/small><\/button><button id=\"interactBtn\">Interact <small>E<\/small><\/button><button id=\"recallBtn\">Recall <small>Q<\/small><\/button><button id=\"facePromptBtn\">Turn \u25b8<\/button><\/div>\n        <div class=\"facing\" id=\"facing\" aria-label=\"Turn deployed companion\"><button data-face=\"north\" aria-label=\"Face north\">\u25b2<\/button><button data-face=\"west\" aria-label=\"Face west\">\u25c0<\/button><button data-face=\"south\" aria-label=\"Face south\">\u25bc<\/button><button data-face=\"east\" aria-label=\"Face east\">\u25b6<\/button><\/div>\n        <div class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">Professor Thales has a quick demonstration ready.<\/div>\n        <div class=\"keyline\"><kbd>WASD<\/kbd> walk \u00b7 <kbd>1\u20134<\/kbd> choose \u00b7 <kbd>P<\/kbd> place \u00b7 <kbd>Space<\/kbd> power \u00b7 <kbd>E<\/kbd> interact \u00b7 <kbd>Q<\/kbd> recall<\/div>\n      <\/aside>\n    <\/div>\n    <div class=\"mobile\" aria-label=\"Touch controls\"><div class=\"dpad\"><button data-dir=\"north\" aria-label=\"Move north\">\u25b2<\/button><button data-dir=\"west\" aria-label=\"Move west\">\u25c0<\/button><button data-dir=\"south\" aria-label=\"Move south\">\u25bc<\/button><button data-dir=\"east\" aria-label=\"Move east\">\u25b6<\/button><\/div><div class=\"mobile-actions\"><button data-mobile=\"place\">Place<\/button><button data-mobile=\"use\">Power<\/button><button data-mobile=\"interact\">Interact<\/button><button data-mobile=\"recall\">Recall<\/button><button data-mobile=\"undo\">Undo<\/button><button data-mobile=\"guide\">Guide<\/button><\/div><\/div>\n  <\/main>\n<\/div>\n<div class=\"overlay\" id=\"overlay\"><section class=\"panel\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\"><\/section><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div><input id=\"importInput\" type=\"file\" accept=\"application/json,.json\" hidden>\n<script>const ECHO_ASSETS = {\"pug\": \"../../assets/b0991b363e363dae322ffef642a504057604bc58c07b64a37b0c0ff8619506f9.png\", \"octopus\": \"../../assets/87c4a51b9af12bf79395e81c0f2cd11c0534b6aa9b553d9e514d460a6f3669c6.png\", \"minotaur\": \"../../assets/2e225617fb11469b161ff1d34936b0de223ecd56274ea4c6cd9f5794e06142ab.png\", \"siren\": \"../../assets/62e5d178c154a36e799cce167d6c10a663a0434eec0adb1edbdcbef6a5a1d0dd.png\", \"nautilus\": \"../../assets/b51f5f95e1eaf5745ff8b42c0286ffa87a8b40a1574849959c68f9614520873c.png\", \"professor\": \"../../assets/eb209755957154d301d41ed7dc6a389f01f4b5729103f9810468aa672a13a147.png\", \"rockman\": \"../../assets/276d100b62c5c2fe0a3933b975ccb5e31202fa7b67b8d671c694497f7095b099.png\"};<\/script>\n<script>\"use strict\";\n\n// Pure combat rules. The browser runtime owns presentation, inventory and saves.\nconst Combat = (() => {\n  let engineSequence = 0;\n  const copy = value => JSON.parse(JSON.stringify(value));\n  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));\n  const finite = (value, fallback) => Number.isFinite(value) ? value : fallback;\n  const dictionary = value => Array.isArray(value)\n    ? Object.fromEntries(value.map(entry => [entry.id, entry]))\n    : value || {};\n\n  function create(content, rng = Math.random, options = {}) {\n    const species = dictionary(content.species);\n    const moves = dictionary(content.moves);\n    const typeChart = content.typeChart || {};\n    const prefix = `${Date.now().toString(36)}-${++engineSequence}`;\n    let serial = 0;\n    const uid = kind => `${kind}-${prefix}-${++serial}`;\n    const roll = () => clamp(finite(rng(), 0.5), 0, 0.999999999999);\n    const event = (type, text, extra = {}) => ({type, text, ...extra});\n\n    function definition(id) {\n      if (!Object.prototype.hasOwnProperty.call(species, id)) {\n        throw new Error(`Unknown creature: ${id}`);\n      }\n      return species[id];\n    }\n\n    for (const [id, sp] of Object.entries(species)) {\n      if (!sp.base || !Number.isFinite(sp.base.hp) || sp.base.hp <= 0) {\n        throw new Error(`Invalid base HP for ${id}`);\n      }\n      if (!Array.isArray(sp.moves) || !sp.moves.length || sp.moves.length > 4 ||\n          sp.moves.some(move => !Object.prototype.hasOwnProperty.call(moves, move))) {\n        throw new Error(`Invalid move set for ${id}`);\n      }\n      if (sp.next) {\n        definition(sp.next);\n        const threshold = sp.evolveAt ?? sp.evolve;\n        if (!Number.isInteger(threshold) || threshold < 2 || threshold > 99) {\n          throw new Error(`Invalid evolution level for ${id}`);\n        }\n      }\n      const seen = new Set([id]);\n      let next = sp.next;\n      while (next) {\n        if (seen.has(next)) throw new Error(`Evolution cycle at ${id}`);\n        seen.add(next);\n        next = definition(next).next;\n      }\n    }\n    for (const [id, move] of Object.entries(moves)) {\n      if (!['attack', 'guard', 'heal'].includes(move.kind || 'attack')) {\n        throw new Error(`Invalid move kind for ${id}`);\n      }\n    }\n\n    function maxHp(mon) {\n      return Math.max(1, Math.floor(definition(mon.species).base.hp + clamp(mon.level, 1, 99) * 3));\n    }\n\n    function makeMon(id, level = 5) {\n      definition(id);\n      const mon = {uid: uid('mon'), species: id,\n        level: Math.floor(clamp(finite(level, 5), 1, 99)), xp: 0, hp: 0};\n      mon.hp = maxHp(mon);\n      return mon;\n    }\n\n    function moveIds(mon) {\n      const defaults = definition(mon.species).moves;\n      const selected = Array.isArray(mon.moves) && mon.moves.length ? mon.moves : defaults;\n      return selected.filter(id => Object.prototype.hasOwnProperty.call(moves, id)).slice(0, 4);\n    }\n\n    function cleanMon(raw) {\n      definition(raw.species);\n      const mon = copy(raw);\n      mon.uid = typeof raw.uid === 'string' && raw.uid ? raw.uid : uid('mon');\n      mon.level = Math.floor(clamp(finite(raw.level, 5), 1, 99));\n      mon.xp = Math.floor(clamp(finite(raw.xp, 0), 0, xpNeeded(mon.level) - 1));\n      mon.hp = Math.floor(clamp(finite(raw.hp, maxHp(mon)), 0, maxHp(mon)));\n      if (raw.moves) {\n        if (!Array.isArray(raw.moves) || !raw.moves.length || raw.moves.length > 4 ||\n            raw.moves.some(id => !Object.prototype.hasOwnProperty.call(moves, id))) {\n          throw new Error(`Invalid learned moves for ${mon.species}`);\n        }\n        mon.moves = [...raw.moves];\n      }\n      return mon;\n    }\n\n    function xpNeeded(level) {\n      return Math.max(7, Math.floor(level) * 7);\n    }\n\n    function applyExperience(raw, amount) {\n      const mon = cleanMon(raw);\n      const evolutions = [];\n      let levelsGained = 0;\n      if (mon.level >= 99) {\n        mon.xp = 0;\n        return {mon, evolutions, levelsGained};\n      }\n      mon.xp += Math.max(0, Math.floor(finite(amount, 0)));\n      while (mon.level < 99 && mon.xp >= xpNeeded(mon.level)) {\n        mon.xp -= xpNeeded(mon.level);\n        const previousMax = maxHp(mon);\n        mon.level++;\n        levelsGained++;\n        let sp = definition(mon.species);\n        while (sp.next && mon.level >= (sp.evolveAt ?? sp.evolve)) {\n          const from = mon.species;\n          mon.species = sp.next;\n          evolutions.push({from, to: mon.species, uid: mon.uid});\n          sp = definition(mon.species);\n        }\n        if (mon.hp > 0) mon.hp = Math.min(maxHp(mon), mon.hp + maxHp(mon) - previousMax);\n      }\n      if (mon.level === 99) mon.xp = 0;\n      return {mon, evolutions, levelsGained};\n    }\n\n    function teach(raw, moveId, slot) {\n      if (!Object.prototype.hasOwnProperty.call(moves, moveId)) throw new Error(`Unknown move: ${moveId}`);\n      const mon = cleanMon(raw);\n      const chosen = moveIds(mon);\n      if (!Number.isInteger(slot) || slot < 0 || slot >= Math.min(4, chosen.length + 1)) {\n        throw new Error('Choose a valid move slot.');\n      }\n      if (slot === 0 && moveId !== definition(mon.species).moves[0]) {\n        throw new Error('Keep the basic move in the first slot.');\n      }\n      if (chosen.includes(moveId) && chosen[slot] !== moveId) throw new Error('That move is already known.');\n      chosen[slot] = moveId;\n      mon.moves = chosen;\n      return mon;\n    }\n\n    function begin(party, encounter) {\n      if (!Array.isArray(party) || !party.length || party.length > 6) {\n        throw new Error('A battle requires a party of one to six creatures.');\n      }\n      const playerParty = party.map(cleanMon);\n      const playerIndex = playerParty.findIndex(mon => mon.hp > 0);\n      if (playerIndex < 0) throw new Error('Your team needs healing before a battle.');\n      const kind = encounter.kind || 'wild';\n      if (!['wild', 'trainer', 'gym'].includes(kind)) throw new Error(`Invalid battle kind: ${kind}`);\n      if (!Array.isArray(encounter.enemyTeam) || !encounter.enemyTeam.length ||\n          encounter.enemyTeam.length > 6 || (kind === 'wild' && encounter.enemyTeam.length !== 1)) {\n        throw new Error('Invalid opposing team.');\n      }\n      const enemyParty = encounter.enemyTeam.map(mon => {\n        const instance = makeMon(mon.species, mon.level);\n        if (mon.moves) instance.moves = [...mon.moves];\n        return cleanMon(instance);\n      });\n      return {\n        id: uid('battle'), playerParty, enemyParty, playerIndex, enemyIndex: 0,\n        phase: 'action', kind, trainerId: encounter.trainerId || null,\n        rewards: copy(encounter.rewards || {}), ballsUsed: 0, potionsUsed: 0,\n        playerGuard: false, enemyGuard: false,\n        participants: [playerParty[playerIndex].uid], turn: 0\n      };\n    }\n\n    function active(battle, side) {\n      return battle[`${side}Party`][battle[`${side}Index`]];\n    }\n    const name = mon => definition(mon.species).name;\n    const stat = (mon, field) => Math.max(1,\n      finite(definition(mon.species).base[field], 8) + mon.level * (field === 'speed' ? 1 : 1.2));\n    function effectiveness(move, defender) {\n      const row = typeChart[move.type] || {};\n      return Math.max(0, finite(row[definition(defender.species).type], 1));\n    }\n\n    function finish(battle, type, events, captured = null) {\n      const evolutions = [];\n      if (type === 'victory') {\n        const experience = battle.enemyParty.reduce((total, mon) => total + 18 + mon.level * 7, 0);\n        battle.playerParty = battle.playerParty.map(mon => {\n          if (mon.hp <= 0) return mon;\n          const amount = Math.floor(experience * (battle.participants.includes(mon.uid) ? 1 : 0.55));\n          const result = applyExperience(mon, amount);\n          evolutions.push(...result.evolutions);\n          events.push(event('experience', `${name(mon)} gained ${amount} experience.`, {\n            uid: mon.uid, amount, levelsGained: result.levelsGained\n          }));\n          if (result.levelsGained) events.push(event('level',\n            `${name(result.mon)} reached level ${result.mon.level}.`, {uid: mon.uid, level: result.mon.level}));\n          return result.mon;\n        });\n      }\n      battle.phase = 'end';\n      battle.playerGuard = false;\n      battle.enemyGuard = false;\n      const outcome = {\n        type, party: copy(battle.playerParty), ballsUsed: battle.ballsUsed,\n        potionsUsed: battle.potionsUsed,\n        rewards: type === 'victory' ? copy(battle.rewards) : {}, evolutions\n      };\n      if (captured) outcome.captured = copy(captured);\n      events.push(event(type, {\n        victory: battle.kind === 'wild' ? 'You won the battle!' : 'You defeated the opposing team!',\n        defeat: 'Your team needs a rest. You will return to a healing center.',\n        capture: `${captured ? name(captured) : 'The creature'} joined your collection!`,\n        run: 'You escaped safely.'\n      }[type]));\n      return outcome;\n    }\n\n    function checkFaint(battle, side, events) {\n      const mon = active(battle, side);\n      if (mon.hp > 0) return null;\n      events.push(event('faint', `${name(mon)} fainted.`, {side, uid: mon.uid}));\n      const party = battle[`${side}Party`];\n      const next = party.findIndex(candidate => candidate.hp > 0);\n      if (next < 0) return finish(battle, side === 'enemy' ? 'victory' : 'defeat', events);\n      battle[`${side}Guard`] = false;\n      if (side === 'player') {\n        battle.phase = 'forced-switch';\n        events.push(event('choose-switch', 'Choose a healthy companion to continue.'));\n      } else {\n        battle.enemyIndex = next;\n        events.push(event('send-out', `Your opponent sends out ${name(active(battle, 'enemy'))}!`, {side, index: next}));\n      }\n      return null;\n    }\n\n    function executeMove(battle, side, moveId, events, customMove = null) {\n      const targetSide = side === 'player' ? 'enemy' : 'player';\n      const mon = active(battle, side);\n      const target = active(battle, targetSide);\n      const move = customMove || moves[moveId];\n      const kind = move.kind || 'attack';\n      if (kind === 'guard') {\n        battle[`${side}Guard`] = true;\n        events.push(event('guard', `${name(mon)} guards against the next hit.`, {side, moveId}));\n        return null;\n      }\n      if (kind === 'heal') {\n        const configured = Number.isFinite(move.healRatio)\n          ? maxHp(mon) * clamp(move.healRatio, 0, 1)\n          : finite(move.heal, move.power > 0 ? move.power : maxHp(mon) * 0.28);\n        const amount = Math.max(1, Math.floor(configured));\n        const restored = Math.min(maxHp(mon) - mon.hp, amount);\n        mon.hp += restored;\n        events.push(event('heal', `${name(mon)} used ${move.name} and recovered ${restored} HP.`, {side, amount: restored, moveId}));\n        return null;\n      }\n      let accuracy = finite(move.accuracy, 1);\n      if (accuracy > 1) accuracy /= 100;\n      accuracy = clamp(accuracy, 0, 1);\n      if (accuracy < 1 && roll() >= accuracy) {\n        events.push(event('miss', `${name(mon)} used ${move.name}, but missed.`, {side, moveId}));\n        return null;\n      }\n      const mult = effectiveness(move, target);\n      // Content powers use a conventional 26\u201365 scale. A basic early hit should\n      // leave room to weaken and capture, rather than decide a fight in one turn.\n      const raw = Math.max(2, finite(move.power, 8) * 0.32 + stat(mon, 'atk') * 0.5 - stat(target, 'def') * 0.28);\n      const guarded = battle[`${targetSide}Guard`];\n      const amount = mult === 0 ? 0 : Math.max(1, Math.floor(raw * mult * (0.9 + roll() * 0.2) * (guarded ? 0.5 : 1)));\n      const dealt = Math.min(target.hp, amount);\n      target.hp -= dealt;\n      if (amount > 0) battle[`${targetSide}Guard`] = false;\n      const effectText = mult === 0 ? ' It had no effect.' : mult > 1 ? ' Very effective!' : mult < 1 ? ' Resisted.' : '';\n      events.push(event('damage', `${name(mon)} used ${move.name}: ${dealt} damage.${effectText}`, {\n        side, targetSide, amount: dealt, multiplier: mult, guarded, moveId\n      }));\n      return checkFaint(battle, targetSide, events);\n    }\n\n    function enemyMove(battle) {\n      const mon = active(battle, 'enemy');\n      const target = active(battle, 'player');\n      const options = moveIds(mon);\n      const healing = options.find(id => moves[id].kind === 'heal');\n      if (healing && mon.hp < maxHp(mon) * 0.35 && roll() < 0.45) return healing;\n      const attacks = options.filter(id => (moves[id].kind || 'attack') === 'attack');\n      if (!attacks.length) return options[0];\n      const ranked = attacks.map(id => {\n        const mv = moves[id];\n        let accuracy = finite(mv.accuracy, 1);\n        if (accuracy > 1) accuracy /= 100;\n        return {id, score: finite(mv.power, 8) * effectiveness(mv, target) * accuracy};\n      }).sort((a, b) => b.score - a.score);\n      if (ranked.length === 1 || roll() < 0.65) return ranked[0].id;\n      return attacks[Math.floor(roll() * attacks.length)];\n    }\n\n    function act(inputBattle, action) {\n      const battle = copy(inputBattle);\n      const events = [];\n      const result = outcome => ({battle, events, outcome: outcome || null});\n      const invalid = text => {\n        events.push(event('invalid', text));\n        return result(null);\n      };\n      if (battle.phase === 'end') return result(null);\n      if (!action || typeof action.kind !== 'string') return invalid('Choose an action.');\n      if (battle.phase === 'forced-switch' && action.kind !== 'switch') {\n        return invalid('Choose a healthy companion first.');\n      }\n      if (!['action', 'forced-switch'].includes(battle.phase)) return invalid('The battle is not ready.');\n\n      // Optional release modules can add actions without embedding their rules in\n      // every game. Standard actions and validation retain ownership here.\n      const standardActions=['move','switch','run','capture','healItem'];\n      const customAction=!standardActions.includes(action.kind)&&options.actions?.[action.kind];\n      if(typeof customAction==='function')return customAction({\n        battle,action,events,result,invalid,\n        active:side=>active(battle,side),definition,maxHp,\n        emit:(type,text,extra)=>events.push(event(type,text,extra)),\n        useMove:(side,move)=>executeMove(battle,side,move.id,events,move),\n        enemyTurn:()=>executeMove(battle,'enemy',enemyMove(battle),events)\n      });\n\n      if (action.kind === 'switch') {\n        const index = action.index;\n        if (!Number.isInteger(index) || index < 0 || index >= battle.playerParty.length ||\n            index === battle.playerIndex || battle.playerParty[index].hp <= 0) {\n          return invalid('Choose a different healthy companion.');\n        }\n        const forced = battle.phase === 'forced-switch';\n        battle.playerIndex = index;\n        battle.playerGuard = false;\n        battle.phase = 'action';\n        const next = active(battle, 'player');\n        if (!battle.participants.includes(next.uid)) battle.participants.push(next.uid);\n        events.push(event('switch', `Go, ${name(next)}!`, {side: 'player', index, forced}));\n        if (forced) return result(null);\n        battle.turn++;\n        return result(executeMove(battle, 'enemy', enemyMove(battle), events));\n      }\n\n      if (action.kind === 'run') {\n        if (battle.kind !== 'wild') return invalid('Finish this trainer battle before leaving.');\n        battle.turn++;\n        return result(finish(battle, 'run', events));\n      }\n\n      if (action.kind === 'capture') {\n        if (ba -h/3,w*2/3,h*2/3)}}\n\n  function drawCreature(id, placement, now) {\n    const cx=placement.x*TILE+24,cy=placement.y*TILE+24+Math.sin(now/260+placement.x)*1.3;\n    ctx.save();ctx.fillStyle='#f6eab7b8';ctx.beginPath();ctx.ellipse(cx,cy+17,18,7,0,0,Math.PI*2);ctx.fill();drawSprite(id,cx,cy,44,44);drawFacingArrow(cx,cy,placement.facing,SPECIES[id]?.color||'#0e747a',true);ctx.restore();\n  }\n\n  function drawFacingArrow(cx,cy,direction,color,strong=false){const [dx,dy]=DIR[direction]||[1,0];const ax=cx+dx*25,ay=cy+dy*25;ctx.save();ctx.translate(ax,ay);ctx.rotate(Math.atan2(dy,dx));ctx.fillStyle=strong?'#fff067':color;ctx.strokeStyle='#17383c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-5,-7);ctx.lineTo(-2,0);ctx.lineTo(-5,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}\n\n  function drawPlayer(player, now) {\n    const cx=player.x*TILE+24,cy=player.y*TILE+24+Math.sin(now/180)*.7;\n    ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#314e45';ctx.fillRect(-11,14,8,8);ctx.fillRect(3,14,8,8);ctx.fillStyle='#e9c59a';ctx.fillRect(-9,-17,18,12);ctx.fillStyle='#5c3a28';ctx.fillRect(-10,-19,20,6);ctx.fillRect(-11,-14,4,7);ctx.fillStyle='#1f8d8b';ctx.fillRect(-11,-5,22,20);ctx.fillStyle='#f1e2bd';ctx.fillRect(-7,-3,14,14);ctx.fillStyle='#9a5634';ctx.fillRect(-14,-4,7,18);ctx.fillStyle='#d58943';ctx.fillRect(-13,-1,5,12);ctx.fillStyle='#17393d';ctx.fillRect(-6,-12,3,3);ctx.fillRect(4,-12,3,3);drawFacingArrow(0,-1,player.facing,'#fff067',true);ctx.restore();\n  }\n\n  function drawPreview(walls, barriers, now) {\n    const placement=view.placed?.[view.selected]; if(!placement || (placement.room&&placement.room!==view.room))return;\n    const meta=SPECIES[view.selected]; const [dx,dy]=DIR[placement.facing]||[0,0];\n    const length=view.selected==='siren'?5:view.selected==='nautilus'?10:view.selected==='octopus'?3:1;\n    ctx.save();ctx.setLineDash([8,5]);ctx.lineDashOffset=-(now/70)%13;ctx.lineWidth=view.selected==='siren'||view.selected==='nautilus'?7:4;ctx.strokeStyle=`${meta?.color||'#3bb'}aa`;ctx.beginPath();ctx.moveTo(placement.x*TILE+24,placement.y*TILE+24);\n    for(let i=1;i<=length;i++){const x=placement.x+dx*i,y=placement.y+dy*i,barrier=barriers.get(`${x},${y}`);if(walls.has(`${x},${y}`)||(barrier&&barrier.kind!=='chasm'))break;ctx.lineTo(x*TILE+24,y*TILE+24)}ctx.stroke();ctx.restore();\n  }\n\n  function drawEffects(now) {\n    effects=effects.filter(effect=>now-effect.started<effect.duration);\n    for(const effect of effects){const t=(now-effect.started)/effect.duration;\n      if(effect.kind==='sound'){for(let i=0;i<effect.points.length;i++){const p=effect.points[i];if(t<i/Math.max(1,effect.points.length)*.55)continue;ctx.strokeStyle=effect.amplified?'#fff06d':'#d3fff0';ctx.lineWidth=effect.amplified?5:3;ctx.globalAlpha=1-t;ctx.beginPath();ctx.arc(p.x*TILE+24,p.y*TILE+24,8+22*t,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}\n      else if(effect.points){ctx.strokeStyle=effect.kind==='push'?'#efbd4d':'#e889da';ctx.lineWidth=6;ctx.globalAlpha=1-t;ctx.beginPath();effect.points.forEach((p,i)=>{const px=p.x*TILE+24,py=p.y*TILE+24;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.globalAlpha=1}\n      else if(effect.kind==='fail'){ctx.fillStyle=`rgba(183,70,56,${1-t})`;ctx.font='900 28px system-ui';ctx.textAlign='center';ctx.fillText('!',effect.x*TILE+24,effect.y*TILE+10-18*t)}\n    }\n  }\n\n  function tick(now){raf=0;drawWorld(now);if(effects.length)raf=requestAnimationFrame(tick)}\n\n  function openWelcome() {\n    modalMode='welcome'; els.overlay.hidden=false; els.modal.className='panel';\n    els.modal.innerHTML=`<div class=\"professor\"><div class=\"professor-portrait\"><img src=\"${ASSETS.professor || ''}\" alt=\"Professor Thales\"><div class=\"nameplate\">Professor Thales<\/div><\/div><div class=\"dialog-copy\"><div class=\"eyebrow\">Field lesson<\/div><h1 id=\"modalTitle\">Welcome to Echo Ruins<\/h1><p>Recover the Tideglass Ornament by combining companion powers, then bring it back to the landing display.<\/p><\/div><\/div><div class=\"note\">I can show one short sound puzzle. You can watch, try the practice objects yourself, or explore now. Nothing in the lesson solves the real ruins.<\/div><div class=\"choices\"><button class=\"primary\" data-welcome=\"watch\">Watch demo<\/button><button data-welcome=\"try\">Try it myself<\/button><button data-welcome=\"later\">Later<\/button><\/div>`;\n    els.modal.querySelectorAll('[data-welcome]').forEach(button=>button.addEventListener('click',()=>{\n      if(button.dataset.welcome==='watch') startDemo(); else { markTutorialSeen(); closeModal(); setFeedback(button.dataset.welcome==='try'?'Try placing a companion on an adjacent tile. The floating target and crate are safe practice.':'Explore freely. Open the Field guide whenever you want the demonstration.'); }\n    }));\n  }\n\n  function markTutorialSeen(){const result=EchoRuins.step(state,{type:'tutorialSeen'});state=result.state;view=EchoRuins.view(state);save();render()}\n\n  function startDemo(){\n    modalMode='demo';\n    demo={index:0,paused:true,timer:null,frames:(typeof EchoRuins.demoFrames==='function'?EchoRuins.demoFrames():[])||[]};\n    renderDemo();\n  }\n\n  const DEMO_COPY=[\n    ['1 \u00b7 Choose Siren','Siren sends a note in the direction she faces.'],\n    ['2 \u00b7 Place beside you','The bright arrow shows exactly where her song will travel.'],\n    ['3 \u00b7 The short note fades','The resonator is too far away. Try a companion that can carry the sound farther.'],\n    ['4 \u00b7 Add Nautilus','Place Nautilus on the song line, facing the same direction.'],\n    ['5 \u00b7 Align the arrows','Matching arrows let Nautilus catch and carry the sound.'],\n    ['6 \u00b7 Use Siren','The longer golden echo reaches the resonator. Now try the real controls!']\n  ];\n\n  function renderDemo(){\n    if(!demo)return; const copy=DEMO_COPY[demo.index];\n    els.modal.innerHTML=`<div class=\"eyebrow\">Professor Thales\u2019s demonstration \u00b7 playback only<\/div><h2 id=\"modalTitle\">Sound travels in a straight line<\/h2><div class=\"demo-layout\"><div class=\"demo-stage\"><canvas id=\"demoCanvas\" width=\"480\" height=\"300\" aria-label=\"Animated Siren and Nautilus demonstration\"><\/canvas><\/div><div class=\"demo-copy\"><strong>${copy[0]}<\/strong><p>${copy[1]}<\/p><div class=\"progress\"><i style=\"width:${(demo.index+1)/6*100}%\"><\/i><\/div><div class=\"demo-controls\"><button data-demo=\"pause\">${demo.paused?'Play':'Pause'}<\/button><button class=\"primary\" data-demo=\"next\">${demo.index===5?'Finish':'Next'}<\/button><button data-demo=\"skip\">Skip<\/button><\/div><\/div><\/div>`;\n    drawDemoFrame($('demoCanvas'),demo.index);\n    els.modal.querySelector('[data-demo=\"pause\"]').addEventListener('click',()=>{demo.paused=!demo.paused;clearInterval(demo.timer);demo.timer=null;if(!demo.paused)demo.timer=setInterval(()=>{if(!demo)return;if(demo.index>=5){finishDemo();return}demo.index++;renderDemo()},5000);renderDemo()});\n    els.modal.querySelector('[data-demo=\"next\"]').addEventListener('click',()=>{if(demo.index===5)finishDemo();else{demo.index++;renderDemo()}});\n    els.modal.querySelector('[data-demo=\"skip\"]').addEventListener('click',finishDemo);\n  }\n\n  function drawDemoFrame(canvas,index){\n    const c=canvas.getContext('2d');const frame=demo?.frames?.[[0,2,4,6,8,12][index]];c.imageSmoothingEnabled=false;c.fillStyle='#eadab0';c.fillRect(0,0,480,300);\n    for(let y=0;y<10;y++)for(let x=0;x<16;x++){c.strokeStyle='#c4b184';c.strokeRect(x*30+.5,y*30+.5,29,29)}\n    c.fillStyle='#244f51';c.fillRect(430,105,30,90);c.fillStyle=index>=5?'#ffe86b':'#547176';c.beginPath();c.arc(445,150,16,0,Math.PI*2);c.fill();\n    const sirenX=90,nautilusX=240,y=150;const draw=(id,x,size)=>{const img=images[id];if(img?.complete)c.drawImage(img,x-size/2,y-size/2,size,size);};draw('siren',sirenX,64);if(frame?.nautilus || index>=3)draw('nautilus',nautilusX,62);\n    c.fillStyle='#fff06b';c.strokeStyle='#183c40';c.lineWidth=2;for(const x of [125,index>=3?275:-99]){if(x<0)continue;c.beginPath();c.moveTo(x+14,y);c.lineTo(x-9,y-9);c.lineTo(x-5,y);c.lineTo(x-9,y+9);c.closePath();c.fill();c.stroke()}\n    if(index>=2){const amplified=frame?.amplified||index>=5;c.lineWidth=amplified?7:4;c.strokeStyle=amplified?'#ffd94f':'#9de8da';c.setLineDash([12,8]);c.beginPath();c.moveTo(sirenX+32,y);c.lineTo(amplified?445:205,y);c.stroke();c.setLineDash([]);}\n    if(index===2){c.fillStyle='#a13f36';c.font='900 24px system-ui';c.fillText('fades',190,122)}\n  }\n\n  function finishDemo(){if(demo?.timer)clearInterval(demo.timer);demo=null;markTutorialSeen();closeModal();setFeedback('Your turn: place companions beside you, turn their arrows, and use their powers. The landing objects are safe practice.')}\n\n  function openGuide(){\n    modalMode='guide';els.overlay.hidden=false;els.modal.className='panel';\n    els.modal.innerHTML=`<div class=\"eyebrow\">Always available<\/div><h2 id=\"modalTitle\">Field guide<\/h2><p>Every power uses the same rhythm: <b>choose \u2192 place beside you \u2192 turn \u2192 use<\/b>.<\/p><div class=\"guide-grid\">${Object.entries(SPECIES).map(([id,m])=>`<div class=\"guide-card\"><b>${m.name} \u00b7 ${m.verb}<\/b><p>${m.detail}.<\/p><\/div>`).join('')}<div class=\"guide-card\"><b>Move & interact<\/b><p>WASD/arrows move. E interacts. Tap the map to place on an adjacent tile.<\/p><\/div><div class=\"guide-card\"><b>Correct a setup<\/b><p>Q recalls. Undo reverses spatial actions in this room. Reset restores room objects without removing rewards.<\/p><\/div><\/div><div class=\"choices\"><button class=\"primary\" data-guide=\"demo\">Replay Professor demo<\/button><button data-guide=\"close\">Back to ruins<\/button><\/div>`;\n    els.modal.querySelector('[data-guide=\"demo\"]').addEventListener('click',startDemo);els.modal.querySelector('[data-guide=\"close\"]').addEventListener('click',closeModal);\n  }\n\n  function hintText(){\n    const status=view.status||{};\n    const hints={landing:[\n      'The floating target and wooden crate are safe places to test powers.',\n      state.encounterComplete?'The eastern path leads deeper into the ruins.':'A wild Nautilus is near the tidepool. Weaken it before throwing an Echo Orb.',\n      'For sound practice, place Siren in a clear row. Add Nautilus farther along that row, with both arrows matching.'\n    ],courtyard:[\n      status.gate?'The central gate is open. The eastern passage reaches the gallery.':'The gate accepts either a distant lever or the heavy stone on its socket.',\n      'Octopus can reach three tiles, including across water. Face it toward the submerged lever.',\n      'Minotaur pushes what is directly ahead. Line it up behind the track weight and push toward the socket.'\n    ],gallery:[\n      status.bell?'Cross the new bridge and inspect the glowing pedestal.':'The far bell needs a stronger sound than Siren makes alone.',\n      'Place Siren and Nautilus in one clear row. Both arrows must point toward the bell.',\n      state.reward?'The Tideglass Ornament belongs in the landing display. A shortcut is now open.':'Sound crosses water and the chasm, but stone walls stop it.'\n    ]};\n    const list=hints[view.room]||['Explore the marked objects.'];return list[hintLevel++%list.length];\n  }\n\n  function showHint(){setFeedback(`Field note: ${hintText()}`)}\n\n  function openMenu(){\n    modalMode='menu';els.overlay.hidden=false;els.modal.className='panel';\n    els.modal.innerHTML=`<div class=\"eyebrow\">Local expedition data<\/div><h2 id=\"modalTitle\">Save &amp; more<\/h2><div class=\"menu-row\"><div><b>${saveAvailable?'Progress saves on this device':'Saving is unavailable'}<\/b><small>${saveAvailable?'Stable exploration, captures, and rewards are saved automatically.':'The whole demo still works until this page closes.'}<\/small><\/div><span class=\"chip\">${state.reward?'Ornament found':'Exploring'}<\/span><\/div><div class=\"menu-row\"><div><b>Export progress<\/b><small>Download a small JSON backup for this Echo Ruins demo.<\/small><\/div><button data-menu=\"export\">Export<\/button><\/div><div class=\"menu-row\"><div><b>Import progress<\/b><small>Only version 1 Echo Ruins saves are accepted.<\/small><\/div><button data-menu=\"import\">Import<\/button><\/div><div class=\"menu-row\"><div><b>Restart local demo<\/b><small>Clears only this demo\u2019s local save and starts at the landing.<\/small><\/div><button class=\"danger\" data-menu=\"restart\">Restart<\/button><\/div><div class=\"choices\"><button class=\"primary\" data-menu=\"close\">Back to ruins<\/button><\/div>`;\n    els.modal.querySelectorAll('[data-menu]').forEach(button=>button.addEventListener('click',()=>menuAction(button.dataset.menu)));\n  }\n\n  function menuAction(action){\n    if(action==='close'){closeModal();return}if(action==='export'){exportSave();return}if(action==='import'){els.importInput.value='';els.importInput.click();return}\n    if(action==='restart'){try{localStorage.removeItem(SAVE_KEY)}catch(_){}state=EchoRuins.fresh();state=EchoRuins.normalize({...state,party:newParty()})||EchoRuins.fresh();view=EchoRuins.view(state);undoStack=[];feedbackText='A fresh expedition begins at Aegean Landing.';save();closeModal();render();openWelcome()}\n  }\n\n  function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='echo-ruins-save-v1.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Echo Ruins save exported.')}\n  async function importSave(){const file=els.importInput.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!inRelease(parsed))throw new Error('wrong release');const normalized=EchoRuins.normalize(parsed);if(!normalized||!inRelease(normalized))throw new Error('invalid');state=normalized;if(!validParty(state.party))state=EchoRuins.normalize({...state,party:newParty()})||EchoRuins.fresh();view=EchoRuins.view(state);undoStack=[];save();closeModal();render();toast('Echo Ruins progress imported.')}catch(_){toast('That file is not a valid Echo Ruins version 1 save.')}}\n\n  function closeModal(){if(demo?.timer)clearInterval(demo.timer);if(modalMode==='demo')demo=null;if(modalMode!=='battle'){modalMode=null;els.overlay.hidden=true;els.canvas.focus()}}\n\n  function startBattle(checkpoint){\n    if(!battleEngine){setFeedback('The Nautilus is curious, but the battle module is unavailable in this build.');return}\n    battleCheckpoint=clone(checkpoint);battleStartingInventory={balls:state.balls,potions:state.potions};\n    if(!validParty(state.party))state={...state,party:newParty()};\n    try{battle=battleEngine.begin(state.party,{kind:'wild',enemyTeam:[{species:'nautilus',level:4}]})}catch(_){battle=null;setFeedback('The recovery spring restored your field team. Try approaching Nautilus again.');return}\n    modalMode='battle';els.overlay.hidden=false;renderBattle(['A wild Nautilus rises from the tidepool! Weaken it, then use an Echo Orb.']);\n  }\n\n  function activeMon(side){if(!battle)return null;const party=side==='player'?battle.playerParty:battle.enemyParty;const index=side==='player'?battle.playerIndex:battle.enemyIndex;return party[index]}\n  function monName(mon){return battleEngine?.content?.species?.[mon.species]?.name||SPECIES[mon.species]?.name||mon.species}\n  function hpPercent(mon){return Math.max(0,Math.min(100,mon.hp/battleEngine.maxHp(mon)*100))}\n\n  function renderBattle(messages=[]){\n    if(!battle)return;const ally=activeMon('player'),enemy=activeMon('enemy');const balls=Math.max(0,battleStartingInventory.balls-(battle.ballsUsed||0));const potions=Math.max(0,battleStartingInventory.potions-(battle.potionsUsed||0));\n    els.modal.className='panel battle-card';els.modal.innerHTML=`<div class=\"eyebrow\">Tidepool encounter \u00b7 friendly and repeatable<\/div><h2 id=\"modalTitle\">Befriend Nautilus<\/h2><div class=\"battle-top\"><div class=\"fighter\"><img src=\"${ASSETS[ally.species]||''}\" alt=\"${monName(ally)}\"><b>${monName(ally)} \u00b7 Lv. ${ally.level}<\/b><small>${ally.hp} / ${battleEngine.maxHp(ally)} HP<\/small><div class=\"hp\"><i style=\"width:${hpPercent(ally)}%\"><\/i><\/div><\/div><div class=\"fighter enemy\"><img src=\"${ASSETS.nautilus||''}\" alt=\"Wild Nautilus\"><b>Wild Nautilus \u00b7 Lv. ${enemy.level}<\/b><small>${enemy.hp} / ${battleEngine.maxHp(enemy)} HP<\/small><div class=\"hp\"><i style=\"width:${hpPercent(enemy)}%\"><\/i><\/div><\/div><\/div><div class=\"battle-log\" role=\"status\" aria-live=\"polite\">${messages.join(' ')||'Choose an action.'}<\/div><div class=\"battle-buttons\"><button data-battle=\"tap\">Gentle Tap<\/button><button data-battle=\"guard\">Guard<\/button><button class=\"gold\" data-battle=\"capture\">Echo Orb<\/button><button data-battle=\"potion\">Tonic<\/button><\/div><div class=\"battle-buttons\" style=\"margin-top:7px\"><button data-battle=\"switch\">Switch friend<\/button><button data-battle=\"run\">Step away<\/button><\/div><div class=\"battle-inventory\">${balls} Echo Orb${balls===1?'':'s'} \u00b7 ${potions} Tonic${potions===1?'':'s'} \u00b7 Lower HP makes befriending easier.<\/div>`;\n    els.modal.querySelectorAll('[data-battle]').forEach(button=>button.addEventListener('click',()=>battleAction(button.dataset.battle)));\n  }\n\n  function battleAction(action){\n    if(!battle)return;let command;\n    if(action==='tap')command={kind:'move',index:0};else if(action==='guard')command={kind:'move',index:1};else if(action==='capture')command={kind:'capture',balls:Math.max(0,battleStartingInventory.balls-(battle.ballsUsed||0))};else if(action==='potion')command={kind:'healItem',potions:Math.max(0,battleStartingInventory.potions-(battle.potionsUsed||0))};else if(action==='run')command={kind:'run'};else if(action==='switch'){const options=battle.playerParty.map((mon,index)=>({mon,index})).filter(({mon,index})=>index!==battle.playerIndex&&mon. .friendships[id] === true;\n      state.habitats[id].observed = saved.observed === true;\n      for (const key of target.conditions) state.habitats[id][key] = saved[key] === true;\n      state.habitats[id].comfort = Number.isInteger(saved.comfort) && saved.comfort >= 0 && saved.comfort <= 2 ? saved.comfort : 0;\n      state.habitats[id].setbacks = Number.isInteger(saved.setbacks) && saved.setbacks >= 0 && saved.setbacks <= 99 ? saved.setbacks : 0;\n      if (state.friendships[id]) { for (const key of target.conditions) state.habitats[id][key] = true; state.habitats[id].comfort = 2; }\n    }\n    if (state.friendships.pug && state.tutorial !== 'complete') state.tutorial = 'complete';\n    return state;\n  }\n  function active(state) { return state.habitats[state.area]; }\n  function creature(state) { return CREATURES[state.area]; }\n  function conditionsMet(state) { const h = active(state), c = creature(state); return c.conditions.every(key => h[key]); }\n  function distanceToCreature(state) { const c = creature(state), p = state.player; return Math.abs(p.x-c.x)+Math.abs(p.y-c.y); }\n  function insideComfortRing(state) { return distanceToCreature(state) <= creature(state).ring; }\n  function nearCreature(state) { return distanceToCreature(state) <= 7; }\n  function nearEnvironment(state) { const t = creature(state).target, p = state.player; return Math.abs(p.x-t.x)+Math.abs(p.y-t.y) <= 1; }\n  function inWatchingBand(state) { const distance = distanceToCreature(state); return distance > creature(state).ring && distance <= 7; }\n  function isWalkable(source, x, y) {\n    const state=normalize(source); if (!state || x < 1 || x > 15 || y < 1 || y > 9) return false;\n    return !((state.area === 'octopus' || state.area === 'nautilus') && x >= 11 && y >= 2 && y <= 8);\n  }\n  function nextState(state, change) { const result = normalize(state) || fresh(); change(result); return normalize(result) || fresh(); }\n  function behavior(state, id) {\n    if (state.friendships[id] '); return; }\n        next.player.facing = direction;\n        const d = DIRECTION[direction], x = next.player.x + d.x, y = next.player.y + d.y;\n        if (!isWalkable(next,x,y)) event = message('wrong',(x < 1 || x > 15 || y < 1 || y > 9) ? 'A low marble wall marks the edge of this habitat.' : 'The water begins beyond this sandy bank.');\n        else { next.player.x=x; next.player.y=y; if (insideComfortRing(next)) { const h=active(next); resetComfort(h); event=message('wrong',`${next.area==='pug'?'Pug backs behind the thyme.':next.area==='octopus'?'Octopus folds into a crevice.':'Nautilus slips behind its shell.'} You are inside the red comfort ring.`); } else event=message('move','You take a quiet step.'); }\n        return;\n      }\n      if (action === 'travel') {\n        if (!validArea(command.area)) { event=message('wrong','That habitat is not on the field map.'); return; }\n        next.area=command.area; next.player=Object.assign({facing:'east'},SPAWNS[command.area]); event=message('move',`You arrive at ${AREAS[command.area].name}.`); return;\n      }\n      if (action === 'tutorial') {\n        if (command.stage === 'demo') { next.tutorial='demo'; event=message('tutorial','Professor Thales places a soft toy. Pug sniffs it, then pauses when he steps back.'); }\n        else if (command.stage === 'practice') { next.tutorial='practice'; next.area='pug'; next.player={x:7,y:6,facing:'east'}; event=message('tutorial','Your turn: use Observe from the turquoise watching band. There is no hurry.'); }\n        else if (command.stage === 'complete') { next.tutorial='complete'; event=message('tutorial','The guide stays available from the Field guide button.'); }\n        else event=message('wrong','Choose the next guide card.');\n        return;\n      }\n      const h = active(next), id = next.area, c = creature(next);\n      if (action === 'observe') {\n        if (!nearCreature(next)) { event=message('info','You cannot read the signal from here. Walk into the turquoise watching band, then observe.'); return; }\n        h.observed = true;\n        if (next.tutorial === 'practice' && id === 'pug') next.tutorial='complete';\n        event = message('right', id === 'pug' ? 'Pug checks the path, then looks at anything soft left nearby.' : id === 'octopus' ? 'The Octopus keeps one eye on the narrow channel and another on the bank.' : 'Nautilus stays close to a place where its shell can rest safely.');\n        return;\n      }\n      if (action === 'environment') {\n        if (!nearEnvironment(next)) { setback(`The useful place is nearby, but not here. Look for the marked ${c.target.label}.`); return; }\n        h[c.environment] = true;\n        event = message('right', id === 'pug' ? 'You set down the soft toy without tossing it. Pug notices.' : id === 'octopus' ? 'You clear reeds from the channel. Water can pass again.' : 'You fit the loose shell pieces into a shaded shelter.');\n        return;\n      }\n      if (action === 'space') {\n        if (!inWatchingBand(next)) { setback(insideComfortRing(next) ? 'The creature needs more room before it can settle.' : 'Step close enough to watch, but stay outside the red comfort ring.'); return; }\n        h.spaceGiven = true; h[c.distance] = true; h.comfort=2;\n        event = message('right', id === 'octopus' ? 'You wait on the quiet bank. The water settles.' : 'You make room and wait without following.');\n        return;\n      }\n      if (action === 'approach') {\n        if (!inWatchingBand(next)) { setback(insideComfortRing(next) ? 'You stepped inside the comfort ring instead of waiting for an approach.' : 'Move to the turquoise watching band before waiting.'); return; }\n        if (conditionsMet(next)) { next.friendships[id]=true; h.comfort=2; const allFriends=count(next.friendships)===ORDER.length; event=message('friend',`${id === 'pug' ? 'Pug trots' : id === 'octopus' ? 'Octopus glides' : 'Nautilus emerges'} over by choice. ${allFriends?'All three friends chose camp \u2 defined' && module.exports) module.exports = WildEncounters;\n\n/* The rest of this file only runs in the self-contained browser demo. */\nif (typeof window !== 'undefined' && typeof document !== 'undefined') (() => {\n  'use strict';\n  const Core = WildEncounters, SAVE_KEY='fakemon-wild-encounters-v2';\n  const $ = id => document.getElementById(id);\n  let state=Core.fresh(), last='Professor Thales is ready to show a careful field method.', modalMode='';\n  const esc = text => String(text).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const assets = () => typeof ECHO_ASSETS !== 'undefined' ? ECHO_ASSETS : (window.ECHO_ASSETS || {});\n  const image = id => assets()[id];\n  const imageCache = {};\n  function spriteImage(id) {\n    const src=image(id); if (!src) return null;\n    if (!imageCache[id] || imageCache[id].getAttribute('src') !== src) { const pic=new Image(); pic.onload=()=>render(); pic.src=src; imageCache[id]=pic; }\n    return imageCache[id].complete ? imageCache[id] : null;\n  }\n  function asset(id) { const src=image(id); return src ? `<img src=\"${src}\" alt=\"\" aria-hidden=\"true\">` : `<span class=\"sprite-fallback\">${id === 'pug' ? '\ud83d\udc36' : id === 'octopus' ? '\ud83d\udc19' : id === 'nautilus' ? '\ud83d\udc1a' : '\u2605'}<\/span>`; }\n  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); return true; } catch (_) { return false; } }\n  function restore() { try { const recovered=Core.normalize(JSON.parse(localStorage.getItem(SAVE_KEY))); if (recovered) state=recovered; } catch (_) {} }\n  function run(command) { const result=Core.step(state,command); state=result.state; last=result.events[0].text; persist(); render(); }\n  function progress(){ return Core.view(state).progress; }\n  function renderNav() { const v=Core.view(state); $('habitats').innerHTML=Object.values(Core.AREAS).map(area=>`<button class=\"habitat ${area.id===state.area?'selected':''}\" data-area=\"${area.id}\"><span>${area.id==='pug'?'\ud83c\udf3f':area.id==='octopus'?'\ud83c\udf0a':'\ud83d\udc1a'}<\/span><b>${esc(area.name)}<\/b><small>${state.friendships[area.id]?'Friend at camp':'Explore'}<\/small><\/button>`).join(''); }\n  function renderCamp() { $('camp').innerHTML=Core.view(state).camp.map(item=>`<div class=\"camp-pal ${item.friend?'friend':''}\">${asset(item.id)}<span>${item.friend ? item.id[0].toUpperCase()+item.id.slice(1) : '\u2026'}<\/span><\/div>`).join(''); }\n  function render() { const v=Core.view(state), p=v.progress; $('areaName').textContent=v.area.name; $('objective').textContent=v.complete ? 'All three creatures chose camp. Field study complete!' : state.friendships[state.area] ? 'This friend has a safe place at camp. Explore another habitat.' : v.area.goal;\n    $('behavior').textContent=v.insideRing ? 'Too close \u2014 step outside the red comfort zone.' : `${state.area[0].toUpperCase()+state.area.slice(1)}: ${v.behavior}.`; $('behavior').classList.toggle('warning',v.insideRing);\n    $('status').textContent=v.hint ? `${last} Hint: ${v.hint}` : last; $('friendCount').textContent=`${p.friends} of ${p.total} friends`; $('friendBar').style.width=`${(p.friends/p.total)*100}%`; $('campLabel').textContent=p.friends===3?'Camp is full of friends!':'Camp';\n    renderNav(); renderCamp(); draw(v); if (state.tutorial==='intro') openGuide('intro');\n  }\n  function tile(ctx,x,y,color){ctx.fillStyle=color;ctx.fillRect(x*48,y*48,48,48);}\n  function draw(v) { const canvas=$('world'), ctx=canvas.getContext('2d'), area=state.area, c=Core.AREAS[area].creature, h=state.habitats[area], phase=state.time%4;\n    ctx.clearRect(0,0,canvas.width,canvas.height); ctx.imageSmoothingEnabled=false;\n    for(let y=0;y<10;y++)for(let x=0;x<16;x++){const water=(area==='octopus'||area==='nautilus')&&x>=11&&y>=2&&y<=8;tile(ctx,x,y,water?'#4aaeb5':area==='octopus'?'#d8c78b':area==='nautilus'?'#e7d29b':'#89b75c');}\n    if(area==='pug'){for(let y=0;y<10;y++){tile(c n  }\n  function openGuide(mode='guide') { modalMode=mode; const step=state.tutorial; let body='';\n    if(mode==='intro' && step==='intro') body=`<div class=\"prof\">${asset('professor')}<div><div class=\"eyebrow\">Professor Thales's field method<\/div><h2>Notice. Help. Make room.<\/h2><p>Watch Pug first. A creature chooses whether to come closer. There are no battles here.<\/p><button class=\"primary\" data-guide=\"demo\">Watch the quick demonstration<\/button><\/div><\/div>`;\n    else if(mode==='intro' && step==='demo') body=`<div class=\"guide-scene\">${asset('pug')}<b>Soft toy \u2192 Pug sniffs<\/b><span>Professor Thales steps back. Pug relaxes instead of being chased.<\/span><\/div><p>Try a safe observation yourself. You can replay this anytime.<\/p><button class=\"primary\" data-guide=\"practice\">Practice Observe<\/button>`;\n    else body=`<div class=\"eyebrow\">Field guide<\/div><h2>Small choices, real signals<\/h2><div class=\"guide-cards\"><div><b>Observe<\/b><span>Look for what the creature notices.<\/span><\/div><div><b>Change surroundings<\/b><span>Offer a useful, gentle change.<\/span><\/div><div><b>Give space<\/b><span>Wait without following.<\/span><\/div><\/div><p>Each habitat has two helpful conditions. Their order does not matter. A too-fast approach only resets comfort; nobody is lost.<\/p><div class=\"row\"><button data-guide=\"close\" class=\"primary\">Return to field<\/button><button data-guide=\"replay\">Replay Pug demo<\/button><\/div>`;\n    $('modal').innerHTML=body; $('overlay').hidden=false;\n  }\n  function closeGuide(){ $('overlay').hidden=true; modalMode=''; if(state.tutorial==='practice') run({type:'tutorial',stage:'complete'}); }\n  function saveMenu(){ const available=persist(); $('modal').innerHTML=`<div class=\"eyebrow\">Field notebook<\/div><h2>Save &amp; more<\/h2><p>${available?'Progress saves on this device.':'Device storage is unavailable. Your current visit still works; export a notebook copy.'}<\/p><div class=\"row\"><button data-menu=\"export\" class=\"primary\">Export notebook<\/button><button data-menu=\"import\">Import notebook<\/button><\/div><div class=\"row\"><button data-menu=\"restart\" class=\"danger\">Start again<\/button><button data-menu=\"close\">Return<\/button><\/div>`; $('overlay').hidden=false; }\n  function exportSave(){ const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));link.download='wild-encounters-notebook.json';link.click();URL.revokeObjectURL(link.href); }\n  function importSave(){ $('importInput').click(); }\n  function bind() { document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target?.tagName==='INPUT'||!$('overlay').hidden)return;const key=e.key.toLowerCase(), dir={arrowup:'north',w:'north',arrowdown:'south',s:'south',arrowleft:'west',a:'west',arrowright:'east',d:'east'}[key];if(dir){e.preventDefault();run({type:'move',direction:dir});}else if(key==='e'||key==='o')run({type:'observe'});else if(key==='c')run({type:'environment'});else if(key==='q')run({type:'space'});else if(key===' ') {e.preventDefault();run({type:'approach'});} });\n    $('habitats').onclick=e=>{const b=e.target.closest('[data-area]');if(b)run({type:'travel',area:b.dataset.area});}; $('touch').onclick=e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(action==='guide')openGuide();else if(action==='menu')saveMenu();else if(action==='move')run({type:'move',direction:b.dataset.dir});else if(action)run({type:action});}; $('actions').onclick=e=>{const b=e.target.closest('button');if(!b)return;run({type:b.dataset.action});}; $('guideBtn').onclick=()=>openGuide(); $('menuBtn').onclick=saveMenu;\n    $('overlay').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.guide==='demo')run({type:'tutorial',stage:'demo'}),openGuide('intro');else if(b.dataset.guide==='practice')run({type:'tutorial',stage:'practice'}),$('overlay').hidden=true;else if(b.dataset.guide==='replay')state.tutorial='demo',openGuide('intro');else if(b.dataset.guide==='close')closeGuide();else if(b.dataset.menu==='close')$('overlay').hidden=true;else if(b.dataset.menu==='export')exportSave();else if(b.dataset.menu==='import')importSave();else if(b.dataset.menu==='restart'){state=Core.fresh();persist();$('overlay').hidden=true;render();}};\n    $('importInput').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const loaded=Core.normalize(JSON.parse(reader.result));if(!loaded)throw Error();state=loaded;last='Notebook imported safely.';persist();$('overlay').hidden=true;render();}catch(_){last='That notebook belongs to another demo or is unreadable.';render();}};reader.readAsText(file);}; }\n  restore(); bind(); render(); window.WildDemo={ready:true,snapshot:()=>Core.view(state),step:command=>{run(command);return Core.view(state);}};\n})();\n<\/script><\/body><\/html>\n", "guardian": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><meta name=\"theme-color\" content=\"#191c30\"><title>Temple Guardian \u00b7 Fakemon Field Demo<\/title>\n<style>\n[hidden]{display:none!important}:root{--paper:#fff8e7;--sand:#e7dcc1;--ink:#24283b;--cobalt:#3159ae;--terra:#ab472f;--gold:#e5b854;--navy:#191c30;--line:#746d5d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--navy);color:var(--ink);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif}button{min-height:44px;padding:8px 10px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);font:800 12px/1.15 inherit;cursor:pointer;touch-action:manipulation}button:hover:not(:disabled){background:#fffdf4}button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}button:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--cobalt);border-color:#182856;color:#fff}.gold{background:var(--gold);border-color:#6f5420}.quiet{background:var(--sand)}.shell{width:min(960px,calc(100% - 20px));margin:10px auto 24px;overflow:hidden;border:3px solid var(--ink);background:var(--paper)}.mast{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--navy);color:var(--paper)}.seal{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--gold);font:900 25px Georgia;color:var(--gold)}.title{min-width:0;flex:1}.title b,.title span{display:block}.title b{font-size:clamp(18px,3vw,25px);line-height:1.05}.title span{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#ddd2b6}.mast button{min-height:36px;padding:5px 7px;background:transparent;border-color:#d6c9aa;color:var(--paper);box-shadow:none;font-size:10px}.mission{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:8px 12px;border-bottom:3px solid var(--ink);background:var(--sand)}.turn{font-size:13px;font-weight:950}.objective{font-size:13px;color:#3d3a50}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 7px;border:2px solid var(--ink);background:var(--paper);font-size:11px;font-weight:850}.play{display:grid;grid-template-columns:minmax(0,1fr) 285px;background:var(--navy)}.board-wrap{padding:12px;background-color:var(--navy);background-size:48px 4px;background-repeat:repeat-x;background-position:left 4px top 4px}canvas{display:block;width:100%;max-width:610px;margin:auto;aspect-ratio:1;border:4px solid var(--ink);background:#dcbf83;box-shadow:4px 4px 0 var(--gold);image-rendering:pixelated;touch-action:manipulation}.panel{display:flex;flex-direction:column;gap:8px;padding:10px;border-left:3px solid var(--ink);background:var(--paper)}.panel h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#4c4860}.telegraph{padding:9px 10px;border:3px solid var(--terra);background:#f7d9ce}.telegraph b,.telegraph span{display:block}.telegraph b{font-size:14px}.telegraph span{font-size:12px}.status,.feedback{min-height:44px;padding:8px 9px;font-size:12px}.status{border:2px solid var(--line);background:#f6edda}.feedback{display:flex;align-items:center;border:2px solid var(--ink);background:var(--navy);color:var(--paper)}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border:2px solid var(--ink);background:var(--sand)}.moves button{min-height:44px;padding:4px;box-shadow:none;font-size:16px}.moves [data-move=north]{grid-column:2}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{flex:1 1 calc(50% - 4px);min-height:46px}.actions #readyBtn{order:-1;flex-basis:100%;min-height:54px;font-size:14px}.actions #waitBtn{flex-basis:100%}.actions #restartBtn{flex:0 1 auto;min-height:36px;padding:5px 7px;border-color:var(--line);color:#5b576a;background:transparent;box-shadow:none;font-size:11px}.helper-icon{width:30px;height:30px;flex:none;object-fit:contain;image-rendering:pixelated;margin:-4px 1px -4px -4px}.help{margin-top:auto;font-size:11px;color:#555167}.victory{margin:0;padding:10px;border:3px solid #8e6c22;background:#fff0a0;text-align:center}.victory b{display:block;font-size:16px}.tutorial{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:16px;background:#191c30e8}.card{position:relative;width:min(600px,100%);padding:16px;border:3px solid var(--ink);background:var(--paper);box-shadow:7px 7px 0 #0d0f1d}.card:before{content:\"PROFESSOR THALES \u00b7 FIELD NOTES\";display:block;margin:-16px -16px 12px;padding:7px 10px;background:var(--cobalt);color:#fff;font-size:11px;font-weight:900;letter-spacing:.11em}.card h1,.card p{margin:0 0 10px}.card h1{font-size:clamp(22px,4vw,30px);line-height:1.05}.steps{display:grid;gap:0;margin:13px 0;border:2px solid var(--ink)}.step{padding:9px 10px;border-left:5px solid var(--cobalt);background:var(--sand);font-size:13px}.step b{display:block}.card button{width:100%}@media(max-width:720px){.shell{width:100%;margin:0;border:0;border-bottom:3px solid var(--ink)}.play{display:block}.panel{border-left:0;border-top:3px solid var(--ink)}.mission{grid-template-columns:1fr auto}.objective{grid-column:1/-1;grid-row:2}.board-wrap{padding:8px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions #readyBtn{grid-column:1/-1;min-height:54px}.actions #waitBtn{grid-column:1/-1}.actions #restartBtn{grid-column:1/-1;justify-self:start}.moves{max-width:260px;margin:auto}.help{display:block}}@media(max-width:430px){.mast{gap:5px;padding:6px}.seal{width:32px;height:32px;font-size:19px;flex:none}.title span{display:none}.title b{font-size:16px;white-space:nowrap}.mast button{min-height:34px;padding:4px 5px;font-size:9px}.mission{gap:5px;padding:6px 7px}.objective{font-size:12px}.chip{font-size:10px;padding:3px 5px}.board-wrap{padding:7px}canvas{max-width:300px}.panel{padding:8px;gap:7px}.panel h2{display:block}.telegraph{padding:7px}.telegraph b{font-size:13px}.telegraph span{font-size:12px}.status,.feedback{min-height:44px;padding:7px;font-size:12px}.moves button{min-height:44px}.actions button{min-height:44px;font-size:11px}.actions #readyBtn{min-height:52px;font-size:13px}.actions #restartBtn{min-height:36px}.tutorial{padding:8px}.card{padding:14px}.card:before{margin:-14px -14px 11px;font-size:10px}.help{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}<\/style><style data-game-ui=\"pixel\">/* Shared handheld-inspired chrome. World and creature palettes are independent. */\n:root{\n  --ink:#24283b;--muted:#626478;--paper:#fff8e7;--cream:#e7dcc1;\n  --line:#77788c;--sea:#3159ae;--sea2:#5278c5;--gold:#e5b854;\n  --red:#ab472f;--green:#488760;--deep:#191c30;--foam:#e5eafb;\n  --marble:#e7dcc1;--shadow:#171a2a;--radius:0px;\n  --ui-text:Verdana,\"Trebuchet MS\",Arial,sans-serif;\n  --ui-label:\"Lucida Console\",Monaco,\"Courier New\",monospace;\n  color-scheme:light;\n}\nbody{font-family:var(--ui-text);background-image:none}\nbutton,input,select,summary{font-family:inherit}\nbutton,.shell,.game-shell,.panel,.card,.moncard,.guide-card,.fighter,\n.overlay,.note,.toast,#toast,.chip,.type,.bar,.hp,.portrait,.caption,\n.context,.feedback,.status,.step,.victory,.map-node,.battle-tag,\n#battleLog,.battle-log,.progress,.map-label,#interactionHint,kbd{border-radius:0!important}\nbutton:focus-visible,a:focus-visible,summary:focus-visible,canvas:focus-visible{\n  outline:3px solid var(--sea);outline-offset:3px;\n}\nbutton:disabled{cursor:default}\nimg,canvas{image-rendering:pixelated}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n/* Keep direction pads spatially consistent with the map on touch screens. */\n.dpad [data-dir=\"north\"]{grid-row:1;grid-column:2}\n.dpad [data-dir=\"west\"]{grid-row:2;grid-column:1}\n.dpad [data-dir=\"south\"]{grid-row:2;grid-column:2}\n.dpad [data-dir=\"east\"]{grid-row:2;grid-column:3}\n<\/style><\/head><body><main class=\"shell\"><header class=\"mast\"><div class=\"seal\" aria-hidden=\"true\">\u2609<\/div><div class=\"title\"><span>Fakemon field experiment<\/span><b>Temple Guardian<\/b><\/div><button id=\"replayBtn\">Tutorial<\/button><button id=\"importBtn\">Import<\/button><button id=\"saveBtn\">Export save<\/button><\/header><section class=\"mission\"><div id=\"turn\" class=\"turn\">Turn 1<\/div><div id=\"objective\" class=\"objective\">Dodge, block, and strike when a seal is exposed.<\/div><div class=\"chips\"><span id=\"seals\" class=\"chip\">Seals 0/3<\/span><span id=\"stumbles\" class=\"chip\">Stumbles 0/3<\/span><\/div><\/section><section class=\"play\"><div class=\"board-wrap\"><canvas id=\"guardianBoard\" width=\"700\" height=\"700\" tabindex=\"0\" aria-label=\"Temple Guardian board. Orange tiles are hit after Ready. Click a neighboring open tile to preview a move.\"><\/canvas><\/div><aside class=\"panel\"><h2>Plan one action<\/h2><div id=\"telegraph\" class=\"telegraph\"><\/div><div id=\"status\" class=\"status\"><\/div><div class=\"moves\" aria-label=\"Preview a move\"><button data-move=\"north\" aria-label=\"Preview move north\">\u25b2<\/button><button data-move=\"west\" aria-label=\"Preview move west\">\u25c0<\/button><button data-move=\"south\" aria-label=\"Preview move south\">\u25bc<\/button><button data-move=\"east\" aria-label=\"Preview move east\">\u25b6<\/button><\/div><div class=\"actions\"><button id=\"rockBtn\">Rock Man block <small>B<\/small><\/button><button id=\"strikeBtn\" class=\"gold\">Strike seal <small>X<\/small><\/button><button id=\"waitBtn\" class=\"quiet\">Hold position <small>Space<\/small><\/button><button id=\"readyBtn\" class=\"primary wide\">Ready <small>R<\/small><\/button><button id=\"restartBtn\" class=\"wide\">Restart encounter<\/button><\/div><div id=\"actionHint\" class=\"status\"><\/div><div id=\"feedback\" class=\"feedback\" role=\"status\" aria-live=\"polite\"><\/div><p class=\"help\">Arrows/WASD preview a move. The guardian never acts while you are choosing.<\/p><p id=\"victory\" class=\"victory\" hidden><b>\u2609 Guardian Emblem<\/b>The guardian recognizes your care and sleeps peacefully.<\/p><\/aside><\/section><\/main><section id=\"tutorial\" class=\"tutorial\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tutorialTitle\"><div class=\"card\"><p class=\"turn\">Professor\u2019s gentle trial<\/p><h1 id=\"tutorialTitle\">Plan, then press Ready.<\/h1><p>This guardian waits as long as you need. Orange tiles are only dangerous after your Ready choice.<\/p><div class=\"steps\"><div class=\"step\"><b>First, dodge the marked sweep.<\/b>Preview one neighboring tile outside the orange row. The next small lesson appears after you succeed.<\/div><\/div><button id=\"closeTutorial\" class=\"primary\">Start the calm practice<\/button><\/div><\/section><input id=\"importInput\" type=\"file\" accept=\"application/json,.json\" hidden><script>const ECHO_ASSETS = {\"pug\": \"../../assets/b0991b363e363dae322ffef642a504057604bc58c07b64a37b0c0ff8619506f9.png\", \"octopus\": \"../../assets/87c4a51b9af12bf79395e81c0f2cd11c0534b6aa9b553d9e514d460a6f3669c6.png\", \"minotaur\": \"../../assets/2e225617fb11469b161ff1d34936b0de223ecd56274ea4c6cd9f5794e06142ab.png\", \"siren\": \"../../assets/62e5d178c154a36e799cce167d6c10a663a0434eec0adb1edbdcbef6a5a1d0dd.png\", \"nautilus\": \"../../assets/b51f5f95e1eaf5745ff8b42c0286ffa87a8b40a1574849959c68f9614520873c.png\", \"professor\": \"../../assets/eb209755957154d301d41ed7dc6a389f01f4b5729103f9810468aa672a13a147.png\", \"rockman\": \"../../assets/276d100b62c5c2fe0a3933b975ccb5e31202fa7b67b8d671c694497f7095b099.png\"};<\/script><script>/* Temple Guardian is deliberately turn based: preview changes no encounter\n * state, and only Ready lets the guardian act. */\nconst GuardianTrial = (() => {\n  'use strict';\n  const VERSION = 1, RELEASE = 'guardian-trial-demo', STORAGE_KEY = 'fakemon.guardian-trial.v1';\n  const SIZE = 7, START = {x: 3, y: 5}, GUARDIAN = {x: 3, y: 3};\n  const dirs = {north:{x:0,y:-1}, east:{x:1,y:0}, south:{x:0,y:1}, west:{x:-1,y:0}};\n  const clone = value => JSON.parse(JSON.stringify(value));\n  const point = (x, y) => ({x, y});\n  const same = (a, b) => a && b && a.x === b.x && a.y === b.y;\n  const inside = (x, y) => Number.isInteger(x) && Number.isInteger(y) && x >= 0 && x < SIZE && y >= 0 && y < SIZE;\n  const event = (type, text, more) => Object.assign({type, text}, more || {});\n\n  function attackFor(pattern) {\n    if (pattern === 0) return {kind:'sweep', name:'Marked sweep', tiles:Array.from({length:SIZE}, (_, x) => point(x, 5)), exposed:false};\n    if (pattern === 1) return {kind:'beam', name:'Sun beam', tiles:Array.from({length:SIZE}, (_, y) => point(3, y)), exposed:false};\n    return {kind:'seal', name:'Exposed seal', tiles:[clone(GUARDIAN)], exposed:true, exposureTurns:pattern === 2 ? 2 : 1, seal:clone(GUARDIAN)};\n  }\n\n  function fresh() {\n    return {version:VERSION, release:RELEASE, turn:1, pattern:0, player:clone(START), seals:0, stumbles:0, tutorialStage:0, learned:false, complete:false, preview:null, attack:attackFor(0)};\n  }\n\n  function normalPosition(value, fallback) {\n    return value && inside(value.x, value.y) && !same(value, GUARDIAN) ? {x:value.x, y:value.y} : clone(fallback);\n  }\n\n  function normalizeState(raw, preservePreview) {\n    if (!raw || typeof raw !== 'object' || raw.version !== VERSION || raw.release !== RELEASE) return null;\n    const state = fresh();\n    state.turn = Number.isInteger(raw.turn) && raw.turn >= 1 && raw.turn <= 99 ? raw.turn : 1;\n    state.player = normalPosition(raw.player, START);\n    state.pattern = Number.isInteger(raw.pattern) && raw.pattern >= 0 && raw.pattern <= 3 ? raw.pattern : 0;\n    state.seals = Number.isInteger(raw.seals) ? Math.max(0, Math.min(3, raw.seals)) : 0;\n    state.stumbles = Number.isInteger(raw.stumbles) ? Math.max(0, Math.min(2, raw.stumbles)) : 0;\n    state.tutorialStage = Number.isInteger(raw.tutorialStage) ? Math.max(0, Math.min(3, raw.tutorialStage)) : 0;\n    state.learned = raw.learned === true || state.tutorialStage >= 3;\n    if (state.learned) state.tutorialStage = 3;\n    state.complete = raw.complete === true || state.seals >= 3;\n    if (state.complete) state.seals = 3;\n    state.preview = preservePreview && raw.preview && typeof raw.preview === 'object' ? clone(raw.preview) : null;\n    state.attack = attackFor(state.pattern);\n    return state;\n  }\n\n  // Save imports intentionally erase previews: no pending action is restored.\n  function normalize(raw) { return normalizeState(raw, false); }\n\n  function legalMove(state, to) {\n    return to && inside(to.x, to.y) && !same(to, GUARDIAN) && Math.abs(to.x - state.player.x) + Math.abs(to.y - state.player.y) === 1;\n  }\n  function adjacentToGuardian(position) { return Math.abs(position.x - GUARDIAN.x) + Math.abs(positio
